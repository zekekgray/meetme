        <div class="sub" style="margin-top:26px;text-align:center">Already have an account? <a href="#" id="signInLink">Sign in</a></div>
        <div style="display:flex;align-items:center;gap:10px;margin:30px 0;color:var(--muted);font-size:12px">
          <div style="flex:1;height:1px;background:#e5e5ea"></div>or<div style="flex:1;height:1px;background:#e5e5ea"></div>
        </div>
        <button class="btn ghost full" id="skipAccount">Continue without an account</button>
      </div>`;
   }
    bind();
  }

  function bind(){
    document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{haptic('light');s.type=b.dataset.type;render()});
    document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{
      haptic('light');
      s.day=parseInt(b.dataset.day,10);
      s.date=`${monthNames[s.viewMonth]} ${s.day}, ${s.viewYear}`;
      s.time=null;
      fetchAvailableTimes(s.viewYear,s.viewMonth,s.day);
    });
    const prevMonth=document.getElementById('prevMonth');
    // ABM-V10-83737102 : guard against navigating before the current real-world month, even if disabled attr is bypassed
    if(prevMonth) prevMonth.onclick=()=>{
      if(s.viewYear===now.getFullYear()&&s.viewMonth===now.getMonth()) return;
      s.viewMonth--; if(s.viewMonth<0){s.viewMonth=11;s.viewYear--;}
      s.day=null; s.time=null; s.availableTimes=[];
      render();
    };
    const nextMonth=document.getElementById('nextMonth');
    if(nextMonth) nextMonth.onclick=()=>{
      s.viewMonth++; if(s.viewMonth>11){s.viewMonth=0;s.viewYear++;}
      s.day=null; s.time=null; s.availableTimes=[];
      render();
    };
    document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{haptic('light');s.time=b.dataset.time;render()});
    document.querySelectorAll('[data-duration]').forEach(b=>b.onclick=()=>{haptic('light');s.duration=b.dataset.duration;render()});
    document.querySelectorAll('[data-location]').forEach(b=>b.onclick=()=>{haptic('light');s.location=b.dataset.location;render()});

    const next=document.getElementById('next');
    if(next) next.onclick=()=>{haptic('medium');s.step++;render()};

    const back=document.getElementById('back');
    if(back) back.onclick=()=>{s.step--;render()};

    const form=document.getElementById('form');
    if(form) form.onsubmit=e=>{
      e.preventDefault();
      haptic('medium');
      const name=document.getElementById('name').value.trim();
      const org=document.getElementById('org').value.trim();
      const email=document.getElementById('email').value.trim();
      const phone=document.getElementById('phone').value.trim();
      const notes=document.getElementById('notes').value.trim();
      const submitBtn=form.querySelector('button[type="submit"]');
      runRequestButtonSequence(submitBtn,()=>saveMeetingRequest(name,org,email,phone,notes));
    };

    const requestMeetingLoggedIn=document.getElementById('requestMeetingLoggedIn');
    if(requestMeetingLoggedIn) requestMeetingLoggedIn.onclick=()=>{
      haptic('medium');
      const notesEl=document.getElementById('notes');
      const notes=notesEl?notesEl.value.trim():'';
      runRequestButtonSequence(requestMeetingLoggedIn,()=>saveMeetingRequest(s.account.name,s.account.org,s.account.email,s.account.phone,notes));
    };

    const createAccount=document.getElementById('createAccount');
    if(createAccount) createAccount.onclick=()=>{s.authReturnView='flow';s.authReturnStep=3;s.step=4;render()};

    const goHomeFromConfirm=document.getElementById('goHomeFromConfirm');
    if(goHomeFromConfirm) goHomeFromConfirm.onclick=()=>{s.view='home';render()};

    const skipAccount=document.getElementById('skipAccount');
    if(skipAccount) skipAccount.onclick=()=>{
      resetRequestFlow();
      s.step=0;s.view='flow';
      render();
    };

    const acctForm=document.getElementById('acctForm');
    if(acctForm) acctForm.onsubmit=async e=>{
      e.preventDefault();
      haptic('medium');
      const acctNickname=document.getElementById('acctNickname').value.trim();
      const acctEmail=document.getElementById('acctEmail').value.trim();
      s.authNickname=acctNickname;
      s.otpMode='signup';
      await sendOtp(acctEmail, true, { name:acctNickname, org:s.org, phone:s.phone, timezone:s.timezone });
    };

    const signInLink=document.getElementById('signInLink');
    if(signInLink) signInLink.onclick=e=>{
      e.preventDefault();
      s.authReturnView='flow'; s.authReturnStep=4;
      s.otpMode='signin';
      s.otpError='';
      s.view='signInEmail';
      render();
    };

    const landingSignIn=document.getElementById('landingSignIn');
    if(landingSignIn) landingSignIn.onclick=()=>{
      haptic('light');
      s.authReturnView='landing'; s.authReturnStep=0;
      s.otpMode='signin';
      s.otpError='';
      s.view='signInEmail';
      render();
    };
    const landingSignUp=document.getElementById('landingSignUp');
    if(landingSignUp) landingSignUp.onclick=()=>{
      haptic('light');
      s.authReturnView='landing'; s.authReturnStep=0;
      s.view='flow'; s.step=4;
      render();
    };
    const landingGuest=document.getElementById('landingGuest');
    if(landingGuest) landingGuest.onclick=()=>{
      haptic('light');
      resetRequestFlow();
      s.view='flow'; s.step=0;
      render();
    };
    const backFromCreateAccount=document.getElementById('backFromCreateAccount');
    if(backFromCreateAccount) backFromCreateAccount.onclick=()=>{
      s.view=s.authReturnView; s.step=s.authReturnStep; render();
    };

    const goNewRequest=document.getElementById('goNewRequest');
    if(goNewRequest) goNewRequest.onclick=()=>{resetRequestFlow();s.view='flow';s.step=0;render()};
    const goNewRequest2=document.getElementById('goNewRequest2');
    if(goNewRequest2) goNewRequest2.onclick=()=>{resetRequestFlow();s.view='flow';s.step=0;render()};
    const goMyMeetings=document.getElementById('goMyMeetings');
    if(goMyMeetings) goMyMeetings.onclick=async ()=>{ await loadMyMeetings(); s.view='myMeetings'; render(); };
    const goMyProfile=document.getElementById('goMyProfile');
    if(goMyProfile) goMyProfile.onclick=()=>{s.view='myProfile';render()};
    const backHome=document.getElementById('backHome');
    if(backHome) backHome.onclick=()=>{s.view='home';render()};
    const backHome2=document.getElementById('backHome2');
    if(backHome2) backHome2.onclick=()=>{s.view='home';render()};

    const editProfile=document.getElementById('editProfile');
    if(editProfile) editProfile.onclick=()=>{s.editingProfile=true;render()};
    const cancelEditProfile=document.getElementById('cancelEditProfile');
    if(cancelEditProfile) cancelEditProfile.onclick=()=>{s.editingProfile=false;render()};
    const cancelEditProfile2=document.getElementById('cancelEditProfile2');
    if(cancelEditProfile2) cancelEditProfile2.onclick=()=>{s.editingProfile=false;render()};
    const profileForm=document.getElementById('profileForm');
    if(profileForm) profileForm.onsubmit=async e=>{
      e.preventDefault();
      const pfName=document.getElementById('pfName').value.trim();
      const pfOrg=document.getElementById('pfOrg').value.trim();
      const pfPhone=document.getElementById('pfPhone').value.trim();
      const pfTimezone=document.getElementById('pfTimezone').value.trim();
      const saveBtn=profileForm.querySelector('button[type="submit"]');
      if(saveBtn){ saveBtn.disabled=true; saveBtn.textContent='Saving…'; }
      const { error } = await sb.from('profiles').update({
        name:pfName, organization:pfOrg, phone:pfPhone, timezone:pfTimezone
      }).eq('id', s.account.id);
      if(error){
        alert('Could not save your profile: '+error.message);
        if(saveBtn){ saveBtn.disabled=false; saveBtn.textContent='Save changes'; }
        return;
      }
      s.account={...s.account,name:pfName,org:pfOrg,phone:pfPhone,timezone:pfTimezone};
      saveSession();
      s.editingProfile=false;
      render();
    };
    async function doSignOut(){
      await sb.auth.signOut(); // onAuthStateChange('SIGNED_OUT') clears s.account/meetings and re-renders
    }
    const signOut=document.getElementById('signOut');
    if(signOut) signOut.onclick=doSignOut;
    const signOut2=document.getElementById('signOut2');
    if(signOut2) signOut2.onclick=doSignOut;
    document.querySelectorAll('[data-ics]').forEach(b=>b.onclick=()=>{
      const m=s.meetings.find(x=>x.meetingId===b.dataset.ics);
      if(m) downloadIcs(m);
    });

    const signInEmailForm=document.getElementById('signInEmailForm');
    if(signInEmailForm) signInEmailForm.onsubmit=async e=>{
      e.preventDefault();
      haptic('medium');
      const email=document.getElementById('signInEmailInput').value.trim();
      s.otpMode='signin';
      await sendOtp(email, false); // shouldCreateUser:false — sign-in must not silently create a new account
    };
    const backFromSignIn=document.getElementById('backFromSignIn');
    if(backFromSignIn) backFromSignIn.onclick=()=>{
      s.otpError='';
      s.view=s.authReturnView; s.step=s.authReturnStep;
      render();
    };

    const otpForm=document.getElementById('otpForm');
    if(otpForm) otpForm.onsubmit=e=>{
      e.preventDefault();
      haptic('medium');
      const code=document.getElementById('otpInput').value.trim();
      s.otpDigits=code;
      if(!/^\d{6}$/.test(code)){
        s.otpError='Enter the 6-digit code from your email.';
        render();
        return;
      }
      verifyOtp(code);
    };
    const resendOtpBtn=document.getElementById('resendOtp');
    if(resendOtpBtn) resendOtpBtn.onclick=()=>{haptic('light');resendOtp()};
    const backFromOtp=document.getElementById('backFromOtp');
    if(backFromOtp) backFromOtp.onclick=()=>{
      s.otpError=''; s.otpDigits=''; s.otpSentAt=null;
      s.view = s.otpMode==='signup' ? 'flow' : 'signInEmail';
      if(s.otpMode==='signup') s.step=4;
      render();
    };

    const ac=document.getElementById('addCalendar');
    if(ac) ac.onclick=()=>downloadIcs({meetingId:s.meetingId,type:s.type,location:s.location});

    const nr=document.getElementById('newRequest');
    if(nr) nr.onclick=()=>{resetRequestFlow();s.step=0;render()};

    // ABM-V11-83737207 : apply the page-transition fade only on actual step/view changes
    if(!window._artimeetSkipPanelAnim){
      const activePanel=publicView.querySelector('.panel');
      if(activePanel) activePanel.classList.add('transition-in');
    }
  }

  function showAdmin(){
    publicView.style.display='none';
    adminView.classList.add('show');
    adminView.innerHTML=`
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
          <div><div class="eyebrow">Internal Artimeet</div><h2>Meeting Requests</h2><div class="sub">Manage requests, confirmations and scheduling.</div></div>
          <button class="btn" id="publicBtn">← Public view</button>
        </div>
        <div class="req">
          <div class="reqhead">
            <div><b>${s.meetingId||'(no request yet)'} · ${s.time||'—'} · ${s.name||'—'}</b><small>${s.org||'—'} · ${s.type} · ${s.location}</small></div>
            <div class="pillrow">
              <span class="pill" id="reqStatus">${s.requestStatus}</span>
              <span class="pill ${s.calendarStatus==='Synced'?'green':'gray'}" id="calStatus">${s.calendarStatus}</span>
            </div>
          </div>
          <div class="reqactions">
            <button class="btn primary" id="confirm">Confirm</button>
            <button class="btn" id="reviewing">Mark Reviewing</button>
            <button class="btn" id="reschedule">Reschedule Requested</button>
            <button class="btn" id="cancel">Cancel</button>
          </div>
        </div>
      </div>`;

    document.getElementById('publicBtn').onclick=()=>{
      adminView.classList.remove('show');
      publicView.style.display='block';
      render();
    };

    function setReqStatus(v,cls){
      document.getElementById('reqStatus').textContent=v;
      document.getElementById('reqStatus').className='pill '+cls;
    }
    document.getElementById('confirm').onclick=()=>{
      setReqStatus('Confirmed','green');
      s.calendarStatus='Synced';
      document.getElementById('calStatus').textContent='Synced';
      document.getElementById('calStatus').className='pill green';
    };
    document.getElementById('reviewing').onclick=()=>setReqStatus('Reviewing','blue');
    document.getElementById('reschedule').onclick=()=>{
      setReqStatus('Reschedule Requested','purple');
      alert('TODO(backend): trigger reschedule workflow / calendar hold release.');
    };
    document.getElementById('cancel').onclick=()=>{haptic('warning');setReqStatus('Cancelled','gray');};
  }

  // ABM-V10-83737105 : restore cached meetings from localStorage on load (fast paint only)
  loadSession();

  // ABM-V1-83736307 : TODO(auth) — swap this for a real authenticated /internal route
  if(new URLSearchParams(location.search).get('internal')==='1'){
    showAdmin();
  } else {
    render();
    // ABM-AUTH : reconcile with the real Supabase session — this is the actual
    // "session restoration after refresh" step (overrides the render() above once resolved)
    restoreSupabaseSession();
  }
})();
</script>
</body>
</html>
<title>Artimeet</title>
<style>
:root{--gold:#c89f4a;--gold2:#e2c47d;--ink:#1c1c1e;--muted:#8e8e93;--line:#e8e2d7;--cream:#f2f2f7;--card:#ffffff;
/* ============================================================
   ABM-V12-83737300 : ARTIMEET MOTION SYSTEM — the only timing/easing tokens used anywhere in this app.
   Principle: motion communicates state, not decorates waiting. No animation exists here to simulate
   effort or hide the fact that an operation was instant — every duration below is doing a specific job.

   MICRO     80–140ms  linear   — buttons, selections, toggles (press acknowledgment)
   STANDARD  180–240ms linear   — cards, sections, content appearing/changing
   EMPHASIS  280–380ms spring   — success states, confirmation entrances (the one earned "moment")
   SPRING    fast, low bounce   — physical press-release only, never used for content appearing
   HAPTIC    light/medium/success/warning — see haptic() function, mapped to the same events as above
   ============================================================ */
--ease-linear:cubic-bezier(.4,0,.2,1);
--dur-micro:.1s;
--dur-standard:.2s;
--dur-emphasis:.32s;
--ease-spring:cubic-bezier(.34,1.56,.64,1);--dur-spring:.2s}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",ui-sans-serif,system-ui,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:980px;margin:auto;padding:24px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.01em}
.menu{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:13px;font-size:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:25px;padding:30px;box-shadow:0 4px 20px rgba(0,0,0,.05)}
/* ABM-V11-83737206/V12 : page/section-transition — applied via JS ONLY when step/view changes, not on every micro-interaction */
.panel.transition-in{animation:panelIn var(--dur-standard) var(--ease-linear)}
@keyframes panelIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.hero{max-width:600px;margin:0 auto;text-align:left}
.eyebrow{color:var(--gold);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
h1{font-size:clamp(28px,4vw,40px);line-height:1.05;letter-spacing:-.04em;margin:6px 0 10px;font-weight:800;color:#1c1c1e}
h2{font-size:28px;letter-spacing:-.03em;margin:5px 0 8px;font-weight:800;color:#000}
.sub,p{color:var(--muted);line-height:1.6}
.choices{display:grid;gap:9px;margin-top:19px}
.choice{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:left;color:var(--ink)}
.choice.active{border-color:var(--ink);background:var(--ink);color:#fff}
.dot{width:17px;height:17px;border:2px solid #cfc8ba;border-radius:50%;flex:none}
.choice.active .dot{display:none}
.btn{border-radius:12px;padding:16px 20px;font-weight:750;font-size:14px;border:1px solid var(--line);background:#fff;color:var(--ink);text-align:center}
.primary{background:#000;color:#fff;border-color:#000;box-shadow:0 7px 16px rgba(0,0,0,.15)}
.btn.secondary{background:#f2f2f7;border:none;color:var(--ink);box-shadow:none}
.btn.ghost{background:transparent;border:none;color:var(--muted);box-shadow:none}
.full{width:100%;margin-top:18px}
.steps{display:flex;gap:7px;margin-bottom:20px}.stepdot{height:3px;flex:1;border-radius:999px;background:#e5e5ea}.stepdot.on{background:var(--ink)}
.calendar{border:1px solid var(--line);border-radius:17px;padding:17px;background:#fff}
.month{display:flex;justify-content:space-between;align-items:center;font-weight:750;margin-bottom:14px}
.month button{border:0;background:transparent;font-size:22px;color:var(--ink)}
/* ABM-V10-83737102 : disabled state for month-nav when at the current real-world month */
.month button:disabled{opacity:.25;cursor:default}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week span{font-size:11px;color:#999}
.day{width:36px;height:36px;margin:0 auto;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink);font-weight:700}
.day:disabled{color:#d1d1d6;font-weight:400;cursor:default}
.day.selected{background:var(--ink);color:#fff;border-radius:50%}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px;animation:fadeSlideIn var(--dur-standard) var(--ease-linear)}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.times .btn{background:#f2f2f7;border:none;color:var(--ink);border-radius:12px}
.time.active{background:var(--ink);color:#fff;border-color:var(--ink)}
/* ABM-V10-83737-pulse : "Preferred time" label pulses a gold dot while a date is picked but no time yet */
.timelabel{transition:color var(--dur-standard) ease}
.timelabel.pulse{position:relative}
.timelabel.pulse::after{content:'';display:inline-block;width:6px;height:6px;background:var(--gold);border-radius:50%;margin-left:8px;vertical-align:middle;animation:dotPulse 1.2s ease-in-out infinite}
@keyframes dotPulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.duration{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.duration .btn{background:#f2f2f7;border:none;color:var(--ink);border-radius:12px}.duration .active{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ABM-V11-83737205 : unified press system. PRESSED (:active pseudo, transient — while finger/cursor is down)
   is intentionally separate from SELECTED (.active class, persistent — set by JS after a choice is made).
   Resting state springs back with overshoot; press-down itself is instant/linear, no bounce going IN. */
.btn,.choice,.day:not(:disabled){
  transform:scale(1);
  transition:transform var(--dur-spring) var(--ease-spring),
             background-color var(--dur-micro) linear,
             filter var(--dur-micro) linear,
             box-shadow var(--dur-micro) linear;
}
.btn:active,.choice:active,.day:not(:disabled):active{
  transform:scale(.985);
  transition:transform var(--dur-micro) linear,
             background-color var(--dur-micro) linear,
             filter var(--dur-micro) linear;
}
.choice:active{background:#f3f0e8}
.choice.active:active{filter:brightness(1.18)}
.btn:not(.primary):active{background:#e6e6eb}
.time:active{background:#e2e2e7}
.time.active:active{filter:brightness(1.25)}
.duration .btn:active{background:#e6e6eb}
.duration .active:active{filter:brightness(1.25)}
.day:not(:disabled):active{background:#ececec}
.day.selected:active{filter:brightness(.82)}
.btn.primary:active{filter:brightness(.85)}

/* ABM-V11-83737208 : Request Meeting button loading/success sequence — in-place feedback, not a full-screen swap */
.btn.is-loading,.btn.is-success{pointer-events:none}
.btn.is-loading{color:transparent;position:relative}
.btn.is-loading::after{
  content:'';position:absolute;top:50%;left:50%;width:16px;height:16px;margin:-8px 0 0 -8px;
  border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;
  animation:btnSpin .6s linear infinite;
}
.btn.secondary.is-loading::after,.btn:not(.primary).is-loading::after{border-color:rgba(28,28,30,.2);border-top-color:var(--ink)}
@keyframes btnSpin{to{transform:rotate(360deg)}}
.btn.is-success{background:#34c759!important;border-color:#34c759!important;color:#fff!important}

/* ABM-V3-83736401 : minimalist monochrome icon system (Apple/SF Symbols style) */
.icon{width:15px;height:15px;vertical-align:-2px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;display:inline-block;margin-right:6px}
a{color:var(--ink);font-weight:700;text-decoration:none}
label{display:block;font-size:11px;font-weight:600;margin:14px 0 7px;color:#1c1c1e}
input,textarea{width:100%;border:1px solid #e5e5ea;border-radius:12px;padding:13px 14px;background:#f2f2f7;outline:none;color:#1c1c1e}
input:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(28,28,30,.08)}
textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .primary{flex:1}
.actions .btn:not(.primary){border:none;background:#f2f2f7;color:var(--ink)}
.confirm{text-align:center;max-width:620px;margin:auto}

/* ABM-V11-83737210 : checkmark scales in first, THEN summary rows fade upward one after another —
   this only fires on the confirmation panel's own entrance (panel.transition-in), not on every re-render */
.check{width:72px;height:72px;background:#34c759;color:#fff;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;
  opacity:0;transform:scale(.4)}
.panel.transition-in .check{animation:checkPop var(--dur-emphasis) var(--ease-spring) .08s forwards}
@keyframes checkPop{to{opacity:1;transform:scale(1)}}
.check svg{width:32px;height:32px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:24;stroke-dashoffset:24}
.panel.transition-in .check svg{animation:checkDraw var(--dur-standard) ease-out .22s forwards}
@keyframes checkDraw{to{stroke-dashoffset:0}}

.confirm h2,.confirm>p.sub{opacity:0;transform:translateY(6px)}
.panel.transition-in .confirm h2{animation:detailFadeUp var(--dur-standard) ease-out .3s forwards}
.panel.transition-in .confirm>p.sub{animation:detailFadeUp var(--dur-standard) ease-out .36s forwards}
@keyframes detailFadeUp{to{opacity:1;transform:translateY(0)}}

.summary{border:1px solid var(--line);border-radius:16px;padding:0 18px;text-align:left;background:#fff;margin:22px 0}
.summary .row{opacity:0;transform:translateY(8px)}
.panel.transition-in .summary .row{animation:detailFadeUp var(--dur-standard) ease-out forwards}
.panel.transition-in .summary .row:nth-child(1){animation-delay:.42s}
.panel.transition-in .summary .row:nth-child(2){animation-delay:.47s}
.panel.transition-in .summary .row:nth-child(3){animation-delay:.52s}
.panel.transition-in .summary .row:nth-child(4){animation-delay:.57s}
.panel.transition-in .summary .row:nth-child(5){animation-delay:.62s}
.panel.transition-in .summary .row:nth-child(6){animation-delay:.67s}
.panel.transition-in .summary .row:nth-child(7){animation-delay:.72s}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #e5e5ea}
.row:last-child{border-bottom:none}
.row b{min-width:120px;font-size:13px;font-weight:600;color:var(--muted)}
.row span{font-size:14px;font-weight:700;color:#1c1c1e;margin-left:auto;text-align:right}
.row span.pill{background:#fff1c9;color:#9a711e;font-weight:750;font-size:11px;padding:5px 9px;border-radius:999px}

.confirm .btn.primary.full{opacity:0;transform:translateY(8px)}
.panel.transition-in .confirm .btn.primary.full{animation:detailFadeUp var(--dur-standard) ease-out .77s forwards}

.admin{display:none}.admin.show{display:block}
.req{border:1px solid var(--line);border-radius:16px;padding:15px;background:#fff;margin-top:10px}
.reqhead{display:flex;justify-content:space-between;gap:12px}.req small{display:block;color:var(--muted);margin-top:5px}
.pill{font-size:11px;padding:5px 9px;border-radius:999px;background:#fff1c9;color:#9a711e;font-weight:750;height:max-content}
.pill.green{background:#e3f5e5;color:#43854b}
.pill.blue{background:#e3ecf9;color:#3a5f9e}
.pill.purple{background:#f1e6fa;color:#7d4aa8}
.pill.gray{background:#eee;color:#777}
.pillrow{display:flex;gap:7px;flex-wrap:wrap}
.reqactions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.reqactions .btn{padding:9px 12px;font-size:12px}
@media(max-width:720px){.app{padding:13px}.panel{padding:21px}.times{grid-template-columns:repeat(2,1fr)}.reqhead{flex-direction:column}.actions{flex-wrap:wrap}.actions .btn{flex:1}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Artimeet</div>
  </header>

  <main id="public"></main>
  <section id="admin" class="admin"></section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  // ── SUPABASE CONFIG ──
  const SUPABASE_URL = 'https://mvjkeybubkikieswhdid.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_tpBXa1V-jn38xmy2OfnTbA_1PE8Xi8N';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false }
  });

  const publicView=document.getElementById('public');
  const adminView=document.getElementById('admin');

  const now=new Date();
  let s={
    step:0,
    type:'Business / Partnership',
    viewMonth:now.getMonth(),
    viewYear:now.getFullYear(),
    day:null,
    date:null,
    time:null,
    duration:'30 min',
    location:'Videocall / Virtual Call',
    timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,
    availableTimes:[],
    loadingTimes:false,
    name:'',org:'',email:'',phone:'',notes:'',
    meetingId:'',
    requestStatus:'Requested',
    calendarStatus:'Not synced',
    account:null, // null = guest. Once "created": { name, email, org, phone, timezone }
    meetings:[],  // this user's own requests only — never other people's
    view:'flow',  // 'flow' (booking wizard, uses s.step) | 'home' | 'myMeetings' | 'myProfile' | 'signInEmail' | 'otp'
    editingProfile:false,
    // ── auth (OTP) state ──
    authEmail:'',        // email the OTP was sent to
    authNickname:'',     // nickname collected at sign-up, applied after verification
    otpMode:'signup',    // 'signup' | 'signin'
    otpDigits:'',
    otpError:'',
    otpLoading:false,
    otpSentAt:null,
    resendCooldown:0,
    authLoading:false
  };

  const types=['Business / Partnership','Product Demo','Client Meeting','Technical Discussion','Career / Hiring','Other'];
  const locations=['Videocall / Virtual Call','Phone Call','In Person'];
  const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];

  function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}

  // ABM-V11-83737200 : unified haptic feedback system.
  // Vibration API is inconsistent across browsers (Android Chrome: yes; iOS Safari: no support at all).
  // haptic() fails silently when unsupported/blocked — the CSS press-state (:active scale) is the
  // visual fallback that ALWAYS fires regardless of haptic support, so feedback never fully disappears.
  const HAPTIC_PATTERNS={
    verylight:[4],
    light:[10],
    medium:[18],
    success:[10,40,10,40,16],
    warning:[25,35,25]
  };
  function haptic(kind){
    if(kind==='none'||!HAPTIC_PATTERNS[kind]) return;
    try{ if(navigator.vibrate) navigator.vibrate(HAPTIC_PATTERNS[kind]); }
    catch(e){ /* unsupported or blocked — visual press-state still applies */ }
  }

  // ABM-V9-83737001 : friendly "City (GMT±X)" display instead of raw IANA string (e.g. Asia/Manila -> Manila (GMT+8))
  function formatTimezone(tz){
    const city=(tz||'').split('/').pop().replace(/_/g,' ');
    const offsetMin=-new Date().getTimezoneOffset();
    const sign=offsetMin>=0?'+':'-';
    const abs=Math.abs(offsetMin);
    const hh=Math.floor(abs/60), mm=abs%60;
    const offsetStr=mm===0?`GMT${sign}${hh}`:`GMT${sign}${hh}:${String(mm).padStart(2,'0')}`;
    return `${city} (${offsetStr})`;
  }

  // ABM-V2-83736326 : cell generator (blanks for offset + real day numbers), Monday-first to match the week header
  function buildCalendarCells(year,month){
    const total=daysInMonth(year,month);
    const firstDow=(new Date(year,month,1).getDay()+6)%7;
    const cells=[];
    for(let i=0;i<firstDow;i++) cells.push(null);
    for(let d=1;d<=total;d++) cells.push(d);
    return cells;
  }

  // TODO(backend): replace with real call e.g. GET /api/availability?date=YYYY-MM-DD
  // ABM-V10-83737101 : delay removed — mock data resolves instantly, no loading flicker on date click
  function fetchAvailableTimes(year,month,day){
    const pool = ['9:00 AM','10:00 AM','11:00 AM','1:00 PM','2:00 PM','3:00 PM','4:00 PM'];
    s.availableTimes = pool;
    s.loadingTimes=false;
    render();
  }

  // ABM-V5-83736609 : TODO(backend) — swap for real Google/Outlook OAuth "add to calendar" instead of raw .ics download
  function downloadIcs(m){
    const ics=`BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:Artimeet — ${m.type}\nDESCRIPTION:Meeting ID ${m.meetingId}\nLOCATION:${m.location}\nEND:VEVENT\nEND:VCALENDAR`;
    const blob=new Blob([ics],{type:'text/calendar'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`${m.meetingId}.ics`;
    a.click();
  }

  function endTime(time,duration){
    let [hm,ap]=time.split(' ');
    let [h,m]=hm.split(':').map(Number);
    if(ap==='PM'&&h!==12)h+=12;
    if(ap==='AM'&&h===12)h=0;
    const d=new Date(2026,0,1,h,m+parseInt(duration));
    let hh=d.getHours(), aa=hh>=12?'PM':'AM';
    hh=hh%12||12;
   return `${hh}:${String(d.getMinutes()).padStart(2,'0')} ${aa}`;
  }

  // ABM-V10-83737104 : client-side persistence only — survives refresh in THIS browser, not cross-device.
  // TODO(backend): replace with real DB + auth (localStorage is not a substitute for a server-side data store).
  function saveSession(){
    try{
      localStorage.setItem('artimeet_session', JSON.stringify({account:s.account, meetings:s.meetings}));
    }catch(e){ /* storage unavailable — fail silently, app still works in-memory */ }
  }
  function loadSession(){
    // Local cache is used only for this browser's cached list of meetings while we
    // wait on the real Supabase session below (restoreSupabaseSession) to resolve.
    try{
      const raw=localStorage.getItem('artimeet_session');
      if(raw){
        const parsed=JSON.parse(raw);
        if(Array.isArray(parsed.meetings)) s.meetings=parsed.meetings;
      }
    }catch(e){ /* corrupted or unavailable — start clean */ }
  }

  // ABM-AUTH : source of truth for "am I signed in" — asks Supabase directly rather than
  // trusting the locally-cached account object, so a session that expired/was revoked
  // elsewhere doesn't leave the UI showing a stale signed-in state.
  async function restoreSupabaseSession(){
    const { data } = await sb.auth.getSession();
    const session = data && data.session;
    if(session && session.user){
      const profile = await fetchProfile(session.user.id);
      s.account = accountFromProfile(session.user, profile);
      s.view='home';
      await loadMyMeetings();
    } else {
      s.account=null;
    }
    render();
  }

  // Keeps s.account in sync if the token refreshes, the user signs in/out in another
  // tab, or the session expires while this tab is open.
  sb.auth.onAuthStateChange(async (event, session)=>{
    if(event==='SIGNED_OUT'){
      s.account=null; s.meetings=[]; saveSession();
      if(s.view!=='flow'){ s.view='flow'; s.step=0; render(); }
      return;
    }
    if((event==='SIGNED_IN'||event==='TOKEN_REFRESHED') && session && session.user){
      const profile = await fetchProfile(session.user.id);
      s.account=accountFromProfile(session.user, profile);
      saveSession();
    }
  });

  // ── AUTH + PROFILES DB (Supabase Email OTP → public.profiles table) ───
  // profiles.id is a foreign key to auth.users.id — see profiles.sql. A DB trigger
  // (handle_new_user) auto-creates the row the moment a new auth user is created, seeded
  // from raw_user_meta_data — which we set below via signInWithOtp's options.data.
  async function fetchProfile(userId){
    const { data, error } = await sb.from('profiles').select('*').eq('id', userId).single();
    if(error) return null; // e.g. trigger hasn't landed yet — verifyOtp() has a fallback upsert
    return data;
  }

  function accountFromProfile(user, profile){
    return {
      id: user ? user.id : null,
      name: (profile && profile.name) || '',
      email: user ? user.email : '',
      org: (profile && profile.organization) || '',
      phone: (profile && profile.phone) || '',
      timezone: (profile && profile.timezone) || s.timezone
    };
  }

  // Sends a one-time-passcode to the given email. shouldCreateUser controls whether a
  // brand-new auth user may be created (true for sign-up, false for sign-in-only).
  // signupData seeds raw_user_meta_data so the new-user DB trigger can populate profiles.
  async function sendOtp(email, shouldCreateUser, signupData){
    s.otpError='';
    s.authLoading=true;
    render();
    const { error } = await sb.auth.signInWithOtp({
      email,
      options:{ shouldCreateUser: !!shouldCreateUser, data: signupData || undefined }
    });
    s.authLoading=false;
    if(error){
      s.otpError = error.message || 'Could not send the code. Please try again.';
      render();
      return false;
    }
    s.authEmail=email;
    s.otpDigits='';
    s.otpSentAt=Date.now();
    startResendCooldown();
    s.view='otp';
    render();
    return true;
  }

  // Verifies the 6-digit code the user typed against the email OTP that was sent.
  async function verifyOtp(code){
    s.otpError='';
    s.otpLoading=true;
    render();
    const { data, error } = await sb.auth.verifyOtp({
      email: s.authEmail,
      token: code,
      type:'email'
    });
    s.otpLoading=false;
    if(error){
      // ABM-AUTH : invalid or expired code — surface inline, keep the user on the OTP screen
      s.otpError = /expired/i.test(error.message) ? 'This code has expired. Request a new one.' : 'That code didn\'t match. Please check and try again.';
      render();
      return;
    }
    const user = data && data.user;
    let profile = user ? await fetchProfile(user.id) : null;
    if(s.otpMode==='signup' && user && !profile){
      // ABM-AUTH : fallback if the DB trigger hasn't landed the row yet — upsert directly
      const { data: upserted } = await sb.from('profiles').upsert({
        id:user.id, name:s.authNickname||'', email:user.email,
        organization:s.org||'', phone:s.phone||'', timezone:s.timezone
      }).select().single();
      profile = upserted;
    }
    s.account = accountFromProfile(user, profile);
    if(s.otpMode==='signup'){
      s.meetings=[]; // fresh account starts with a clean meeting slate
    } else {
      await loadMyMeetings(); // sign-in: pull this user's own meetings (RLS-scoped)
    }
    saveSession();
    s.otpDigits=''; s.otpError=''; s.authEmail=''; s.authNickname='';
    s.view='home';
    render();
  }

  function startResendCooldown(){
    s.resendCooldown=30;
    const tick=()=>{
      s.resendCooldown--;
      if(document.getElementById('resendOtp')||document.getElementById('resendCooldownLabel')) render();
      if(s.resendCooldown>0) setTimeout(tick,1000);
    };
    setTimeout(tick,1000);
  }

  async function resendOtp(){
    if(s.resendCooldown>0 || s.authLoading) return;
    await sendOtp(s.authEmail, s.otpMode==='signup');
  }

  // ABM-V11-83737209 : in-button loading→success sequence. Short and fixed-length (not simulating a real wait) —
  // this is a confirmation affordance, distinct from the network-loading pattern we deliberately removed elsewhere.
  function runRequestButtonSequence(btn,onComplete){
    if(!btn){ onComplete(); return; }
    btn.classList.add('is-loading');
    setTimeout(()=>{
      btn.classList.remove('is-loading');
      btn.classList.add('is-success');
      btn.textContent='✓ Requested';
      haptic('success');
      setTimeout(()=>{
        // ABM-V11-83737211 : brief beat between button success and confirmation card entering
        onComplete();
      },450);
    },150);
  }

  // ── MEETINGS DB (Supabase, RLS-protected by user_id) ────────────────────
  // Loads the signed-in user's own meetings. RLS on public.meetings means this query can
  // only ever return rows where meetings.user_id = auth.uid() — even if the client code
  // were buggy or tampered with, the database itself won't hand back someone else's rows.
  async function loadMyMeetings(){
    if(!s.account || !s.account.id) return;
    const { data, error } = await sb.from('meetings')
      .select('*')
      .order('created_at', { ascending:false });
    if(error){ console.error('loadMyMeetings failed:', error.message); return; }
    s.meetings = (data||[]).map(row=>({
      meetingId: row.meeting_ref,
      date: row.meeting_date,
      time: row.meeting_time,
      type: row.type,
      location: row.location,
      requestStatus: row.status
    }));
  }

  async function submitMeetingRequest(name,org,email,phone,notes){
    s.name=name; s.org=org; s.email=email; s.phone=phone; s.notes=notes;
    s.meetingId='ABM-'+now.getFullYear()+'-'+Math.floor(1000+Math.random()*9000);
    if(s.account && s.account.id){
      // Signed-in guest becomes an owned, RLS-protected row — only this user's session can ever read it back.
      const { error } = await sb.from('meetings').insert({
        user_id: s.account.id,
        meeting_ref: s.meetingId,
        type: s.type,
        meeting_date: s.date,
        meeting_time: s.time,
        duration: s.duration,
        location: s.location,
        notes: notes,
        status: 'Requested',
        calendar_status: 'Not synced'
      });
      if(error){
        alert('Could not save your meeting request: '+error.message);
        return;
      }
      await loadMyMeetings();
    } else {
      // No account yet — nothing to attach a user_id to, so this stays local-only
      // (matches the existing "continue without an account" guest flow).
      s.meetings.push({
        meetingId:s.meetingId,
        date:s.date,
        time:s.time,
        type:s.type,
        location:s.location,
        requestStatus:'Requested'
      });
    }
    saveSession();
    s.step=3;
    render();
  }

  // ABM-V10-83737103 : single source of truth for clearing per-request transient state before starting a new request
  function resetRequestFlow(){
    s.type='Business / Partnership';
    s.day=null; s.date=null; s.time=null;
    s.duration='30 min'; s.location='Videocall / Virtual Call';
    s.availableTimes=[]; s.loadingTimes=false;
    s.name=''; s.org=''; s.email=''; s.phone=''; s.notes='';
    s.meetingId=''; s.requestStatus='Requested'; s.calendarStatus='Not synced';
  }

  function renderHome(){
    publicView.innerHTML=`
    <div class="panel">
     <h2>Welcome back${s.account&&s.account.name?', '+s.account.name:''}</h2>      <div class="sub">${s.account?s.account.email:''}</div>
      <div class="choices" style="margin-top:20px">
        <button class="choice" id="goNewRequest"><span class="dot"></span><span>New meeting request</span></button>
        <button class="choice" id="goMyMeetings"><span class="dot"></span><span>My meetings (${s.meetings.length})</span></button>
        <button class="choice" id="goMyProfile"><span class="dot"></span><span>My profile</span></button>
      </div>
      <button class="btn full" id="signOut" style="margin-top:20px">Sign out</button>
    </div>`;
  }

  function renderMyMeetings(){
    publicView.innerHTML=`
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <div><h2>My Meetings</h2></div>
        <button class="btn" id="backHome">← Back</button>
      </div>
      ${s.meetings.length===0 ? `
        <div style="text-align:center;padding:36px 12px">
          <div style="font-weight:750;font-size:15px;margin-bottom:6px">No meetings yet</div>
          <p class="sub" style="margin:0">Your confirmed and pending meeting requests will appear here.</p>
        </div>
      ` : s.meetings.map(m=>`
        <div class="req">
          <div class="reqhead">
            <div><b>${m.meetingId} · ${m.date} · ${m.time}</b><small>${m.type} · ${m.location}</small></div>
            <div class="pillrow"><span class="pill ${m.requestStatus==='Confirmed'?'green':m.requestStatus==='Reviewing'?'blue':m.requestStatus==='Cancelled'?'gray':''}">${m.requestStatus}</span></div>
          </div>
          <div class="reqactions"><button class="btn" data-ics="${m.meetingId}">＋ Add to Calendar</button></div>
        </div>
      `).join('')}
      <button class="btn primary full" id="goNewRequest2" style="margin-top:16px">+ New request</button>
    </div>`;
  }

  function renderMyProfile(){
    if(s.editingProfile){
      publicView.innerHTML=`
      <div class="panel confirm" style="max-width:420px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
          <h2 style="margin:0">Edit Profile</h2>
          <button class="btn" id="cancelEditProfile">✕ Cancel</button>
        </div>
        <div class="sub">Email can't be changed here — it's your sign-in ID.</div>
        <form id="profileForm">
          <label>Name</label><input id="pfName" value="${s.account&&s.account.name?s.account.name:''}" placeholder="Juan Dela Cruz">
          <label>Org</label><input id="pfOrg" value="${s.account&&s.account.org?s.account.org:''}" placeholder="ABC Company">
          <label>Phone</label><input id="pfPhone" value="${s.account&&s.account.phone?s.account.phone:''}" placeholder="+63 912 345 6789">
          <label>Timezone</label><input id="pfTimezone" value="${s.account?s.account.timezone:''}" placeholder="Asia/Manila">
          <div class="actions"><button class="btn" id="cancelEditProfile2" type="button">Cancel</button><button class="btn primary" type="submit">Save changes</button></div>
        </form>
      </div>`;
      return;
    }
    publicView.innerHTML=`
    <div class="panel confirm" style="max-width:420px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <h2 style="margin:0">My Profile</h2>
        <button class="btn" id="backHome2">← Back</button>
      </div>
      <div class="summary" style="text-align:left">
        <div class="row"><b>Email</b><span>${s.account?s.account.email:''}</span></div>
        <div class="row"><b>Name</b><span>${s.account&&s.account.name?s.account.name:'—'}</span></div>
        <div class="row"><b>Org</b><span>${s.account&&s.account.org?s.account.org:'—'}</span></div>
        <div class="row"><b>Phone</b><span>${s.account&&s.account.phone?s.account.phone:'—'}</span></div>
        <div class="row"><b>Timezone</b><span>${s.account?formatTimezone(s.account.timezone):''}</span></div>
      </div>
      <button class="btn full" id="editProfile">Edit profile</button>
      <button class="btn full" id="signOut2">Sign out</button>
    </div>`;
  }

  function renderSignInEmail(){
    publicView.innerHTML=`
    <div class="panel confirm" style="max-width:420px">
      <h2>Sign in to Artimeet</h2>
      <div class="sub">Enter your email — we'll send you a one-time code, no password needed.</div>
      <form id="signInEmailForm">
        <label>Email</label><input id="signInEmailInput" type="email" required value="${s.authEmail}" placeholder="juan@email.com">
        ${s.otpError ? `<div class="sub" style="color:#c0392b;margin-top:8px">${s.otpError}</div>` : ''}
        <button class="btn primary full" type="submit" ${s.authLoading?'disabled':''}>${s.authLoading?'Sending…':'Send code'}</button>
      </form>
      <button class="btn ghost full" id="backFromSignIn">← Back</button>
    </div>`;
  }

  function renderOtp(){
    const minutesLeft = s.otpSentAt ? Math.max(0, 5 - Math.floor((Date.now()-s.otpSentAt)/60000)) : 5;
    publicView.innerHTML=`
    <div class="panel confirm" style="max-width:420px">
      <h2>Enter your code</h2>
      <div class="sub">We sent a 6-digit code to <b>${s.authEmail}</b>. It expires in about ${minutesLeft||'a few'} minute${minutesLeft===1?'':'s'}.</div>
      <form id="otpForm">
        <label>6-digit code</label>
        <input id="otpInput" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" value="${s.otpDigits}" placeholder="••••••" style="text-align:center;letter-spacing:8px;font-size:20px;font-weight:750">
        ${s.otpError ? `<div class="sub" style="color:#c0392b;margin-top:8px">${s.otpError}</div>` : ''}
        <button class="btn primary full" type="submit" ${s.otpLoading?'disabled':''}>${s.otpLoading?'Verifying…':'Verify & continue'}</button>
      </form>
      <button class="btn secondary full" id="resendOtp" ${s.resendCooldown>0?'disabled':''}>${s.resendCooldown>0?`Resend code (${s.resendCooldown}s)`:'Resend code'}</button>
      <button class="btn ghost full" id="backFromOtp">← Use a different email</button>
    </div>`;
  }

  let _lastRenderKey=null;
  function render(){
    // ABM-V11-83737206 : panelIn should only replay when step/view actually changes — not on every micro-interaction
    // (date/time/duration/location click) within the same screen.
    const renderKey=s.view+':'+s.step+':'+s.editingProfile;
    const isTransition=renderKey!==_lastRenderKey;
    _lastRenderKey=renderKey;
    window._artimeetSkipPanelAnim=!isTransition;

    if(s.view==='home'){ renderHome(); bind(); return; }
    if(s.view==='myMeetings'){ renderMyMeetings(); bind(); return; }
    if(s.view==='myProfile'){ renderMyProfile(); bind(); return; }
    if(s.view==='signInEmail'){ renderSignInEmail(); bind(); return; }
    if(s.view==='otp'){ renderOtp(); bind(); return; }

    if(s.step===0){
      publicView.innerHTML=`
      <div class="panel hero">
        <h1>Let's find a time.</h1>
        <p>Tell us what you'd like to discuss — we'll take it from there.</p>
        <div class="choices">
          ${types.map(t=>`<button class="choice ${s.type===t?'active':''}" data-type="${t}"><span class="dot"></span><span>${t}</span></button>`).join('')}
        </div>
        <button class="btn primary full" id="next">Continue →</button>
      </div>`;
    }

    if(s.step===1){
      const cells=buildCalendarCells(s.viewYear,s.viewMonth);
      const todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate());
      publicView.innerHTML=`
      <div class="panel">
        <div class="steps"><span class="stepdot on"></span><span class="stepdot on"></span><span class="stepdot"></span><span class="stepdot"></span></div>
        <h2>When would you like to meet?</h2>
        <div class="sub">Propose a date and time — we'll confirm and get back to you.</div>
        <div class="calendar">
          <div class="month"><button id="prevMonth" type="button" ${(s.viewYear===now.getFullYear()&&s.viewMonth===now.getMonth())?'disabled':''}><svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;margin:0"><path d="M15 6l-6 6 6 6"/></svg></button><span>${monthNames[s.viewMonth]} ${s.viewYear}</span><button id="nextMonth" type="button"><svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;margin:0"><path d="M9 6l6 6-6 6"/></svg></button></div>
          <div class="week">${['M','T','W','T','F','S','S'].map(x=>`<span>${x}</span>`).join('')}</div>
          <div class="days">${cells.map(d=>{
            if(d===null) return `<span></span>`;
            const isPast=new Date(s.viewYear,s.viewMonth,d)<todayStart;
            return `<button class="day ${s.day===d?'selected':''}" data-day="${d}" ${isPast?'disabled':''}>${d}</button>`;
          }).join('')}</div>
        </div>
        <div class="timelabel${(s.day&&!s.time)?' pulse':''}" style="margin-top:20px;font-weight:750">Preferred time</div>
        <div class="times">${
          !s.day ? `<span class="sub">Select an available date above.</span>` :
          s.loadingTimes ? `<span class="sub">Checking suggested time slots…</span>` :
          s.availableTimes.length===0 ? `<span class="sub">No suggested times for this date — you can still request a time that works for you.</span>` :
          s.availableTimes.map(t=>`<button class="btn time ${s.time===t?'active':''}" data-time="${t}">${t}</button>`).join('')
        }</div>
        <div style="margin-top:20px;font-weight:750">Duration</div>
        <div class="duration">${['30 min','45 min','60 min','Flexible'].map(d=>`<button class="btn ${s.duration===d?'active':''}" data-duration="${d}">${d}</button>`).join('')}</div>
        ${s.duration==='Flexible' ? `<div class="sub" style="margin-top:8px">We'll settle the exact duration with you once confirmed.</div>` : ''}
        <div style="margin-top:20px;font-weight:750">Meeting location</div>
        <div class="duration">${locations.map(l=>`<button class="btn ${s.location===l?'active':''}" data-location="${l}">${l}</button>`).join('')}</div>
        <div class="sub" style="margin-top:12px">Times shown in your timezone: <b>${formatTimezone(s.timezone)}</b></div>
        <div class="actions"><button class="btn" id="back">← Back</button><button class="btn primary" id="next" ${(!s.day||!s.time)?'disabled':''}>Continue →</button></div>
      </div>`;
    }

     if(s.step===2){
      if(s.account){
        publicView.innerHTML=`
        <div class="panel">
          <div class="steps"><span class="stepdot on"></span><span class="stepdot on"></span><span class="stepdot on"></span><span class="stepdot"></span></div>
          <h2>Almost there.</h2>
          <div class="sub">You're booking a meeting with ${s.account.name||'your account'}.</div>
          <div class="summary" style="text-align:left">
            <div class="row"><b>Name</b><span>${s.account.name||'—'}</span></div>
            <div class="row"><b>Org</b><span>${s.account.org||'—'}</span></div>
            <div class="row"><b>Email</b><span>${s.account.email||'—'}</span></div>
          </div>
          <label>Message (optional)</label><textarea id="notes" placeholder="Anything you'd like to discuss...">${s.notes}</textarea>
          <div class="actions"><button class="btn" id="back" type="button">← Back</button><button class="btn primary" id="requestMeetingLoggedIn" type="button">Request Meeting</button></div>
        </div>`;
      } else {
      publicView.innerHTML=`
      <div class="panel">
        <div class="steps"><span class="stepdot on"></span><span class="stepdot on"></span><span class="stepdot on"></span><span class="stepdot"></span></div>
        <h2>Almost there.</h2>
        <div class="sub">Just a few details so we can get back to you with a confirmation.</div>
        <form id="form">
          <label>Full name</label><input id="name" required value="${s.name}" placeholder="Juan Dela Cruz">
          <label>Organization / company (optional)</label><input id="org" value="${s.org}" placeholder="ABC Company">
          <label>Email</label><input id="email" type="email" required value="${s.email}" placeholder="juan@email.com">
          <label>Phone (optional)</label><input id="phone" value="${s.phone}" placeholder="+63 912 345 6789">
          <label>Notes (optional)</label><textarea id="notes" placeholder="Tell us anything we should know.">${s.notes}</textarea>
          <div class="actions"><button class="btn" id="back" type="button">← Back</button><button class="btn primary" type="submit">Request Meeting</button></div>
         </form>
      </div>`;
      }
    }

    if(s.step===3){
      publicView.innerHTML=`
      <div class="panel confirm">
        <div class="check"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>
        <h2>Meeting Requested</h2>
        <!-- TODO(backend): wire to real transactional email service (e.g. SendGrid/Postmark) on request submit + status change -->
        <p class="sub">Reference <b>${s.meetingId}</b>. We'll email you once it's confirmed.</p>
        <div class="summary">
          <div class="row"><b><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>Date</b><span>${s.date}</span></div>
          <div class="row"><b><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>Time</b><span>${s.time}${s.duration==='Flexible' ? ' · Duration TBD' : ' – '+endTime(s.time,s.duration)} (${formatTimezone(s.timezone)})</span></div>
          ${s.duration==='Flexible' ? `<div class="row"><b></b><span style="text-align:left;font-weight:400;color:var(--muted);font-size:12.5px">We'll settle the exact duration with you once the meeting is confirmed.</span></div>` : ''}
          <div class="row"><b><svg class="icon" viewBox="0 0 24 24"><path d="M11 3H4a1 1 0 0 0-1 1v7l9 9 8-8-9-9z"/><circle cx="7.5" cy="7.5" r="1"/></svg>Type</b><span>${s.type}</span></div>
          <div class="row"><b><svg class="icon" viewBox="0 0 24 24"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.3"/></svg>Location</b><span>${s.location}</span></div>
          <div class="row"><b><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.5-4 5-6 7.5-6s6 2 7.5 6"/></svg>Guest</b><span>${s.name}${s.org?' · '+s.org:''}</span></div>
          <div class="row"><b>Status</b><span class="pill">${s.requestStatus==='Requested' ? 'Pending Host Confirmation' : s.requestStatus}</span></div>
        </div>
        <button class="btn primary full" id="addCalendar">＋ Add to Calendar</button>
        ${s.account ? `
          <button class="btn full" id="goHomeFromConfirm">Back to Artimeet</button>
        ` : `
          <div class="sub" style="margin-top:24px;font-weight:750;color:var(--ink)">Want to manage your meetings?</div>
          <div class="sub" style="margin-top:4px">Create an account to view requests, reschedule, cancel, and keep your info for future meetings.</div>
          <button class="btn secondary full" id="createAccount">Create an Artimeet account</button>
          <button class="btn ghost full" id="newRequest">Continue without an account</button>
        `}
      </div>`;
    }

    if(s.step===4){
      publicView.innerHTML=`
      <div class="panel confirm" style="max-width:420px">
        <h2>Create your Artimeet account</h2>
        <div class="sub">Manage this and future meeting requests in one place.</div>
        <form id="acctForm">
          <label>First name / nickname</label><input id="acctNickname" required value="${s.name}" placeholder="Juan">
          <label>Email</label><input id="acctEmail" type="email" required value="${s.email}" placeholder="juan@email.com">
          <button class="btn primary full" type="submit">Create account</button>
        </form>
        <div class="sub" style="margin-top:26px;text-align:center">Already have an account? <a href="#" id="signInLink">Sign in</a></div>
        <div style="display:flex;align-items:center;gap:10px;margin:30px 0;color:var(--muted);font-size:12px">
          <div style="flex:1;height:1px;background:#e5e5ea"></div>or<div style="flex:1;height:1px;background:#e5e5ea"></div>
        </div>
        <button class="btn ghost full" id="skipAccount">Continue without an account</button>
      </div>`;
   }
    bind();
  }

  function bind(){
    document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{haptic('light');s.type=b.dataset.type;render()});
    document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{
      haptic('light');
      s.day=parseInt(b.dataset.day,10);
      s.date=`${monthNames[s.viewMonth]} ${s.day}, ${s.viewYear}`;
      s.time=null;
      fetchAvailableTimes(s.viewYear,s.viewMonth,s.day);
    });
    const prevMonth=document.getElementById('prevMonth');
    // ABM-V10-83737102 : guard against navigating before the current real-world month, even if disabled attr is bypassed
    if(prevMonth) prevMonth.onclick=()=>{
      if(s.viewYear===now.getFullYear()&&s.viewMonth===now.getMonth()) return;
      s.viewMonth--; if(s.viewMonth<0){s.viewMonth=11;s.viewYear--;}
      s.day=null; s.time=null; s.availableTimes=[];
      render();
    };
    const nextMonth=document.getElementById('nextMonth');
    if(nextMonth) nextMonth.onclick=()=>{
      s.viewMonth++; if(s.viewMonth>11){s.viewMonth=0;s.viewYear++;}
      s.day=null; s.time=null; s.availableTimes=[];
      render();
    };
    document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{haptic('light');s.time=b.dataset.time;render()});
    document.querySelectorAll('[data-duration]').forEach(b=>b.onclick=()=>{haptic('light');s.duration=b.dataset.duration;render()});
    document.querySelectorAll('[data-location]').forEach(b=>b.onclick=()=>{haptic('light');s.location=b.dataset.location;render()});

    const next=document.getElementById('next');
    if(next) next.onclick=()=>{haptic('medium');s.step++;render()};

    const back=document.getElementById('back');
    if(back) back.onclick=()=>{s.step--;render()};

    const form=document.getElementById('form');
    if(form) form.onsubmit=e=>{
      e.preventDefault();
      haptic('medium');
      const name=document.getElementById('name').value.trim();
      const org=document.getElementById('org').value.trim();
      const email=document.getElementById('email').value.trim();
      const phone=document.getElementById('phone').value.trim();
      const notes=document.getElementById('notes').value.trim();
      const submitBtn=form.querySelector('button[type="submit"]');
      runRequestButtonSequence(submitBtn,()=>submitMeetingRequest(name,org,email,phone,notes));
    };

    const requestMeetingLoggedIn=document.getElementById('requestMeetingLoggedIn');
    if(requestMeetingLoggedIn) requestMeetingLoggedIn.onclick=()=>{
      haptic('medium');
      const notesEl=document.getElementById('notes');
      const notes=notesEl?notesEl.value.trim():'';
      runRequestButtonSequence(requestMeetingLoggedIn,()=>submitMeetingRequest(s.account.name,s.account.org,s.account.email,s.account.phone,notes));
    };

    const createAccount=document.getElementById('createAccount');
    if(createAccount) createAccount.onclick=()=>{s.step=4;render()};

    const goHomeFromConfirm=document.getElementById('goHomeFromConfirm');
    if(goHomeFromConfirm) goHomeFromConfirm.onclick=()=>{s.view='home';render()};

    const skipAccount=document.getElementById('skipAccount');
    if(skipAccount) skipAccount.onclick=()=>{
      resetRequestFlow();
      s.step=0;s.view='flow';
      render();
    };

    const acctForm=document.getElementById('acctForm');
    if(acctForm) acctForm.onsubmit=async e=>{
      e.preventDefault();
      haptic('medium');
      const acctNickname=document.getElementById('acctNickname').value.trim();
      const acctEmail=document.getElementById('acctEmail').value.trim();
      s.authNickname=acctNickname;
      s.otpMode='signup';
      await sendOtp(acctEmail, true, { name:acctNickname, org:s.org, phone:s.phone, timezone:s.timezone });
    };

    const signInLink=document.getElementById('signInLink');
    if(signInLink) signInLink.onclick=e=>{
      e.preventDefault();
      s.otpMode='signin';
      s.otpError='';
      s.view='signInEmail';
      render();
    };

    const goNewRequest=document.getElementById('goNewRequest');
    if(goNewRequest) goNewRequest.onclick=()=>{resetRequestFlow();s.view='flow';s.step=0;render()};
    const goNewRequest2=document.getElementById('goNewRequest2');
    if(goNewRequest2) goNewRequest2.onclick=()=>{resetRequestFlow();s.view='flow';s.step=0;render()};
    const goMyMeetings=document.getElementById('goMyMeetings');
    if(goMyMeetings) goMyMeetings.onclick=async ()=>{ await loadMyMeetings(); s.view='myMeetings'; render(); };
    const goMyProfile=document.getElementById('goMyProfile');
    if(goMyProfile) goMyProfile.onclick=()=>{s.view='myProfile';render()};
    const backHome=document.getElementById('backHome');
    if(backHome) backHome.onclick=()=>{s.view='home';render()};
    const backHome2=document.getElementById('backHome2');
    if(backHome2) backHome2.onclick=()=>{s.view='home';render()};

    const editProfile=document.getElementById('editProfile');
    if(editProfile) editProfile.onclick=()=>{s.editingProfile=true;render()};
    const cancelEditProfile=document.getElementById('cancelEditProfile');
    if(cancelEditProfile) cancelEditProfile.onclick=()=>{s.editingProfile=false;render()};
    const cancelEditProfile2=document.getElementById('cancelEditProfile2');
    if(cancelEditProfile2) cancelEditProfile2.onclick=()=>{s.editingProfile=false;render()};
    const profileForm=document.getElementById('profileForm');
    if(profileForm) profileForm.onsubmit=async e=>{
      e.preventDefault();
      const pfName=document.getElementById('pfName').value.trim();
      const pfOrg=document.getElementById('pfOrg').value.trim();
      const pfPhone=document.getElementById('pfPhone').value.trim();
      const pfTimezone=document.getElementById('pfTimezone').value.trim();
      const saveBtn=profileForm.querySelector('button[type="submit"]');
      if(saveBtn){ saveBtn.disabled=true; saveBtn.textContent='Saving…'; }
      const { error } = await sb.from('profiles').update({
        name:pfName, organization:pfOrg, phone:pfPhone, timezone:pfTimezone
      }).eq('id', s.account.id);
      if(error){
        alert('Could not save your profile: '+error.message);
        if(saveBtn){ saveBtn.disabled=false; saveBtn.textContent='Save changes'; }
        return;
      }
      s.account={...s.account,name:pfName,org:pfOrg,phone:pfPhone,timezone:pfTimezone};
      saveSession();
      s.editingProfile=false;
      render();
    };
    async function doSignOut(){
      await sb.auth.signOut(); // onAuthStateChange('SIGNED_OUT') clears s.account/meetings and re-renders
    }
    const signOut=document.getElementById('signOut');
    if(signOut) signOut.onclick=doSignOut;
    const signOut2=document.getElementById('signOut2');
    if(signOut2) signOut2.onclick=doSignOut;
    document.querySelectorAll('[data-ics]').forEach(b=>b.onclick=()=>{
      const m=s.meetings.find(x=>x.meetingId===b.dataset.ics);
      if(m) downloadIcs(m);
    });

    const signInEmailForm=document.getElementById('signInEmailForm');
    if(signInEmailForm) signInEmailForm.onsubmit=async e=>{
      e.preventDefault();
      haptic('medium');
      const email=document.getElementById('signInEmailInput').value.trim();
      s.otpMode='signin';
      await sendOtp(email, false); // shouldCreateUser:false — sign-in must not silently create a new account
    };
    const backFromSignIn=document.getElementById('backFromSignIn');
    if(backFromSignIn) backFromSignIn.onclick=()=>{s.otpError='';s.view='flow';s.step=4;render()};

    const otpForm=document.getElementById('otpForm');
    if(otpForm) otpForm.onsubmit=e=>{
      e.preventDefault();
      haptic('medium');
      const code=document.getElementById('otpInput').value.trim();
      s.otpDigits=code;
      if(!/^\d{6}$/.test(code)){
        s.otpError='Enter the 6-digit code from your email.';
        render();
        return;
      }
      verifyOtp(code);
    };
    const resendOtpBtn=document.getElementById('resendOtp');
    if(resendOtpBtn) resendOtpBtn.onclick=()=>{haptic('light');resendOtp()};
    const backFromOtp=document.getElementById('backFromOtp');
    if(backFromOtp) backFromOtp.onclick=()=>{
      s.otpError=''; s.otpDigits=''; s.otpSentAt=null;
      s.view = s.otpMode==='signup' ? 'flow' : 'signInEmail';
      if(s.otpMode==='signup') s.step=4;
      render();
    };

    const ac=document.getElementById('addCalendar');
    if(ac) ac.onclick=()=>downloadIcs({meetingId:s.meetingId,type:s.type,location:s.location});

    const nr=document.getElementById('newRequest');
    if(nr) nr.onclick=()=>{resetRequestFlow();s.step=0;render()};

    // ABM-V11-83737207 : apply the page-transition fade only on actual step/view changes
    if(!window._artimeetSkipPanelAnim){
      const activePanel=publicView.querySelector('.panel');
      if(activePanel) activePanel.classList.add('transition-in');
    }
  }

  function showAdmin(){
    publicView.style.display='none';
    adminView.classList.add('show');
    adminView.innerHTML=`
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
          <div><div class="eyebrow">Internal Artimeet</div><h2>Meeting Requests</h2><div class="sub">Manage requests, confirmations and scheduling.</div></div>
          <button class="btn" id="publicBtn">← Public view</button>
        </div>
        <div class="req">
          <div class="reqhead">
            <div><b>${s.meetingId||'(no request yet)'} · ${s.time||'—'} · ${s.name||'—'}</b><small>${s.org||'—'} · ${s.type} · ${s.location}</small></div>
            <div class="pillrow">
              <span class="pill" id="reqStatus">${s.requestStatus}</span>
              <span class="pill ${s.calendarStatus==='Synced'?'green':'gray'}" id="calStatus">${s.calendarStatus}</span>
            </div>
          </div>
          <div class="reqactions">
            <button class="btn primary" id="confirm">Confirm</button>
            <button class="btn" id="reviewing">Mark Reviewing</button>
            <button class="btn" id="reschedule">Reschedule Requested</button>
            <button class="btn" id="cancel">Cancel</button>
          </div>
        </div>
      </div>`;

    document.getElementById('publicBtn').onclick=()=>{
      adminView.classList.remove('show');
      publicView.style.display='block';
      render();
    };

    function setReqStatus(v,cls){
      document.getElementById('reqStatus').textContent=v;
      document.getElementById('reqStatus').className='pill '+cls;
    }
    document.getElementById('confirm').onclick=()=>{
      setReqStatus('Confirmed','green');
      s.calendarStatus='Synced';
      document.getElementById('calStatus').textContent='Synced';
      document.getElementById('calStatus').className='pill green';
    };
    document.getElementById('reviewing').onclick=()=>setReqStatus('Reviewing','blue');
    document.getElementById('reschedule').onclick=()=>{
      setReqStatus('Reschedule Requested','purple');
      alert('TODO(backend): trigger reschedule workflow / calendar hold release.');
    };
    document.getElementById('cancel').onclick=()=>{haptic('warning');setReqStatus('Cancelled','gray');};
  }

  // ABM-V10-83737105 : restore cached meetings from localStorage on load (fast paint only)
  loadSession();

  // ABM-V1-83736307 : TODO(auth) — swap this for a real authenticated /internal route
  if(new URLSearchParams(location.search).get('internal')==='1'){
    showAdmin();
  } else {
    render();
    // ABM-AUTH : reconcile with the real Supabase session — this is the actual
    // "session restoration after refresh" step (overrides the render() above once resolved)
    restoreSupabaseSession();
  }
})();
</script>
</body>
</html>
