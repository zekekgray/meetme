<!-- ABM-V1-83736316 --><!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- ABM-V1-83736316 -->
<title>Artimeet</title>
<style>
:root{--gold:#c89f4a;--gold2:#e2c47d;--ink:#1c1c1e;--muted:#8e8e93;--line:#e8e2d7;--cream:#f2f2f7;--card:#ffffff;
/* ============================================================
   ABM-V12-83737300 : ARTIMEET MOTION SYSTEM — the only timing/easing tokens used anywhere in this app.
   Principle: motion communicates state, not decorates waiting. No animation exists here to simulate
   effort or hide the fact that an operation was instant — every duration below is doing a specific job.

   MICRO     80–140ms  linear   — buttons, selections, toggles (press acknowledgment)
   STANDARD  180–240ms linear   — cards, sections, content appearing/changing
   EMPHASIS  280–380ms spring   — success states, confirmation entrances (the one earned "moment")
   SPRING    fast, low bounce   — physical press-release only, never used for content appearing
   HAPTIC    light/medium/success/warning — see haptic() function, mapped to the same events as above
   ============================================================ */
--ease-linear:cubic-bezier(.4,0,.2,1);
--dur-micro:.1s;
--dur-standard:.2s;
--dur-emphasis:.32s;
--ease-spring:cubic-bezier(.34,1.56,.64,1);--dur-spring:.2s}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",ui-sans-serif,system-ui,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:980px;margin:auto;padding:24px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.01em}
.menu{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:13px;font-size:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:25px;padding:30px;box-shadow:0 4px 20px rgba(0,0,0,.05)}
/* ABM-V11-83737206/V12 : page/section-transition — applied via JS ONLY when step/view changes, not on every micro-interaction */
.panel.transition-in{animation:panelIn var(--dur-standard) var(--ease-linear)}
@keyframes panelIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.hero{max-width:600px;margin:0 auto;text-align:left}
.eyebrow{color:var(--gold);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
h1{font-size:clamp(28px,4vw,40px);line-height:1.05;letter-spacing:-.04em;margin:6px 0 10px;font-weight:800;color:#1c1c1e}
h2{font-size:28px;letter-spacing:-.03em;margin:5px 0 8px;font-weight:800;color:#000}
.sub,p{color:var(--muted);line-height:1.6}
.choices{display:grid;gap:9px;margin-top:19px}
.choice{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:left;color:var(--ink)}
.choice.active{border-color:var(--ink);background:var(--ink);color:#fff}
.dot{width:17px;height:17px;border:2px solid #cfc8ba;border-radius:50%;flex:none}
.choice.active .dot{display:none}
.btn{border-radius:12px;padding:16px 20px;font-weight:750;font-size:14px;border:1px solid var(--line);background:#fff;color:var(--ink);text-align:center}
.primary{background:#000;color:#fff;border-color:#000;box-shadow:0 7px 16px rgba(0,0,0,.15)}
.btn.secondary{background:#f2f2f7;border:none;color:var(--ink);box-shadow:none}
.btn.ghost{background:transparent;border:none;color:var(--muted);box-shadow:none}
.full{width:100%;margin-top:18px}
.steps{display:flex;gap:7px;margin-bottom:20px}.stepdot{height:3px;flex:1;border-radius:999px;background:#e5e5ea}.stepdot.on{background:var(--ink)}
.calendar{border:1px solid var(--line);border-radius:17px;padding:17px;background:#fff}
.month{display:flex;justify-content:space-between;align-items:center;font-weight:750;margin-bottom:14px}
.month button{border:0;background:transparent;font-size:22px;color:var(--ink)}
/* ABM-V10-83737102 : disabled state for month-nav when at the current real-world month */
.month button:disabled{opacity:.25;cursor:default}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week span{font-size:11px;color:#999}
.day{width:36px;height:36px;margin:0 auto;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink);font-weight:700}
.day:disabled{color:#d1d1d6;font-weight:400;cursor:default}
.day.selected{background:var(--ink);color:#fff;border-radius:50%}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px;animation:fadeSlideIn var(--dur-standard) var(--ease-linear)}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.times .btn{background:#f2f2f7;border:none;color:var(--ink);border-radius:12px}
.time.active{background:var(--ink);color:#fff;border-color:var(--ink)}
/* ABM-V10-83737-pulse : "Preferred time" label pulses a gold dot while a date is picked but no time yet */
.timelabel{transition:color var(--dur-standard) ease}
.timelabel.pulse{position:relative}
.timelabel.pulse::after{content:'';display:inline-block;width:6px;height:6px;background:var(--gold);border-radius:50%;margin-left:8px;vertical-align:middle;animation:dotPulse 1.2s ease-in-out infinite}
@keyframes dotPulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.duration{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.duration .btn{background:#f2f2f7;border:none;color:var(--ink);border-radius:12px}.duration .active{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ABM-V11-83737205 : unified press system. PRESSED (:active pseudo, transient — while finger/cursor is down)
   is intentionally separate from SELECTED (.active class, persistent — set by JS after a choice is made).
   Resting state springs back with overshoot; press-down itself is instant/linear, no bounce going IN. */
.btn,.choice,.day:not(:disabled){
  transform:scale(1);
  transition:transform var(--dur-spring) var(--ease-spring),
             background-color var(--dur-micro) linear,
             filter var(--dur-micro) linear,
             box-shadow var(--dur-micro) linear;
}
.btn:active,.choice:active,.day:not(:disabled):active{
  transform:scale(.985);
  transition:transform var(--dur-micro) linear,
             background-color var(--dur-micro) linear,
             filter var(--dur-micro) linear;
}
.choice:active{background:#f3f0e8}
.choice.active:active{filter:brightness(1.18)}
.btn:not(.primary):active{background:#e6e6eb}
.time:active{background:#e2e2e7}
.time.active:active{filter:brightness(1.25)}
.duration .btn:active{background:#e6e6eb}
.duration .active:active{filter:brightness(1.25)}
.day:not(:disabled):active{background:#ececec}
.day.selected:active{filter:brightness(.82)}
.btn.primary:active{filter:brightness(.85)}

/* ABM-V11-83737208 : Request Meeting button loading/success sequence — in-place feedback, not a full-screen swap */
.btn.is-loading,.btn.is-success{pointer-events:none}
.btn.is-loading{color:transparent;position:relative}
.btn.is-loading::after{
  content:'';position:absolute;top:50%;left:50%;width:16px;height:16px;margin:-8px 0 0 -8px;
  border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;
  animation:btnSpin .6s linear infinite;
}
.btn.secondary.is-loading::after,.btn:not(.primary).is-loading::after{border-color:rgba(28,28,30,.2);border-top-color:var(--ink)}
@keyframes btnSpin{to{transform:rotate(360deg)}}
.btn.is-success{background:#34c759!important;border-color:#34c759!important;color:#fff!important}

/* ABM-V3-83736401 : minimalist monochrome icon system (Apple/SF Symbols style) */
.icon{width:15px;height:15px;vertical-align:-2px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;display:inline-block;margin-right:6px}
a{color:var(--ink);font-weight:700;text-decoration:none}
label{display:block;font-size:11px;font-weight:600;margin:14px 0 7px;color:#1c1c1e}
input,textarea{width:100%;border:1px solid #e5e5ea;border-radius:12px;padding:13px 14px;background:#f2f2f7;outline:none;color:#1c1c1e}
input:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(28,28,30,.08)}
textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .primary{flex:1}
.actions .btn:not(.primary){border:none;background:#f2f2f7;color:var(--ink)}
.confirm{text-align:center;max-width:620px;margin:auto}

/* ABM-V11-83737210 : checkmark scales in first, THEN summary rows fade upward one after another —
   this only fires on the confirmation panel's own entrance (panel.transition-in), not on every re-render */
.check{width:72px;height:72px;background:#34c759;color:#fff;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;
  opacity:0;transform:scale(.4)}
.panel.transition-in .check{animation:checkPop var(--dur-emphasis) var(--ease-spring) .08s forwards}
@keyframes checkPop{to{opacity:1;transform:scale(1)}}
.check svg{width:32px;height:32px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:24;stroke-dashoffset:24}
.panel.transition-in .check svg{animation:checkDraw var(--dur-standard) ease-out .22s forwards}
@keyframes checkDraw{to{stroke-dashoffset:0}}

.confirm h2,.confirm>p.sub{opacity:0;transform:translateY(6px)}
.panel.transition-in .confirm h2{animation:detailFadeUp var(--dur-standard) ease-out .3s forwards}
.panel.transition-in .confirm>p.sub{animation:detailFadeUp var(--dur-standard) ease-out .36s forwards}
@keyframes detailFadeUp{to{opacity:1;transform:translateY(0)}}

.summary{border:1px solid var(--line);border-radius:16px;padding:0 18px;text-align:left;background:#fff;margin:22px 0}
.summary .row{opacity:0;transform:translateY(8px)}
.panel.transition-in .summary .row{animation:detailFadeUp var(--dur-standard) ease-out forwards}
.panel.transition-in .summary .row:nth-child(1){animation-delay:.42s}
.panel.transition-in .summary .row:nth-child(2){animation-delay:.47s}
.panel.transition-in .summary .row:nth-child(3){animation-delay:.52s}
.panel.transition-in .summary .row:nth-child(4){animation-delay:.57s}
.panel.transition-in .summary .row:nth-child(5){animation-delay:.62s}
.panel.transition-in .summary .row:nth-child(6){animation-delay:.67s}
.panel.transition-in .summary .row:nth-child(7){animation-delay:.72s}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #e5e5ea}
.row:last-child{border-bottom:none}
.row b{min-width:120px;font-size:13px;font-weight:600;color:var(--muted)}
.row span{font-size:14px;font-weight:700;color:#1c1c1e;margin-left:auto;text-align:right}
.row span.pill{background:#fff1c9;color:#9a711e;font-weight:750;font-size:11px;padding:5px 9px;border-radius:999px}

.confirm .btn.primary.full{opacity:0;transform:translateY(8px)}
.panel.transition-in .confirm .btn.primary.full{animation:detailFadeUp var(--dur-standard) ease-out .77s forwards}

.admin{display:none}.admin.show{display:block}
.req{border:1px solid var(--line);border-radius:16px;padding:15px;background:#fff;margin-top:10px}
.reqhead{display:flex;justify-content:space-between;gap:12px}.req small{display:block;color:var(--muted);margin-top:5px}
.pill{font-size:11px;padding:5px 9px;border-radius:999px;background:#fff1c9;color:#9a711e;font-weight:750;height:max-content}
.pill.green{background:#e3f5e5;color:#43854b}
.pill.blue{background:#e3ecf9;color:#3a5f9e}
.pill.purple{background:#f1e6fa;color:#7d4aa8}
.pill.gray{background:#eee;color:#777}
.pillrow{display:flex;gap:7px;flex-wrap:wrap}
.reqactions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.reqactions .btn{padding:9px 12px;font-size:12px}
@media(max-width:720px){.app{padding:13px}.panel{padding:21px}.times{grid-template-columns:repeat(2,1fr)}.reqhead{flex-direction:column}.actions{flex-wrap:wrap}.actions .btn{flex:1}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Artimeet</div>
  </header>

  <main id="public"></main>
  <section id="admin" class="admin"></section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  // ── SUPABASE CONFIG ──
  const SUPABASE_URL = 'https://mvjkeybubkikieswhdid.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_tpBXa1V-jn38xmy2OfnTbA_1PE8Xi8N';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false }
  });

  const publicView=document.getElementById('public');
  const adminView=document.getElementById('admin');

  const now=new Date();
  let s={
    step:0,
    type:'Business / Partnership',
    viewMonth:now.getMonth(),
    viewYear:now.getFullYear(),
    day:null,
    date:null,
    time:null,
    duration:'30 min',
    location:'Videocall / Virtual Call',
    timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,
    availableTimes:[],
    loadingTimes:false,
    name:'',org:'',email:'',phone:'',notes:'',
    meetingId:'',
    requestStatus:'Requested',
    calendarStatus:'Not synced',
    account:null, // null = guest. Once "created": { name, email, org, phone, timezone }
    meetings:[],  // this user's own requests only — never other people's
    view:'landing', // 'landing' (sign in / sign up / guest, shown on first open) | 'flow' (booking wizard, uses s.step) | 'home' | 'myMeetings' | 'myProfile' | 'signInEmail' | 'otp'
    editingProfile:false,
    // ── auth (OTP) state ──
    authEmail:'',        // email the OTP was sent to
    authNickname:'',     // nickname collected at sign-up, applied after verification
    otpMode:'signup',    // 'signup' | 'signin'
    otpDigits:'',
    otpError:'',
    otpLoading:false,
    otpSentAt:null,
    resendCooldown:0,
    authLoading:false,
    // ABM-V13 : where "← Back" on the signIn/create-account/otp screens should return to —
    // set right before entering any of those screens, since they can be reached either
    // from the landing screen or from partway through a guest booking.
    authReturnView:'landing',
    authReturnStep:0
  };

  const types=['Business / Partnership','Product Demo','Client Meeting','Technical Discussion','Career / Hiring','Other'];
  const locations=['Videocall / Virtual Call','Phone Call','In Person'];
  const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];

  function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}

  // ABM-V11-83737200 : unified haptic feedback system.
  // Vibration API is inconsistent across browsers (Android Chrome: yes; iOS Safari: no support at all).
  // haptic() fails silently when unsupported/blocked — the CSS press-state (:active scale) is the
  // visual fallback that ALWAYS fires regardless of haptic support, so feedback never fully disappears.
  const HAPTIC_PATTERNS={
    verylight:[4],
    light:[10],
    medium:[18],
    success:[10,40,10,40,16],
    warning:[25,35,25]
  };
  function haptic(kind){
    if(kind==='none'||!HAPTIC_PATTERNS[kind]) return;
    try{ if(navigator.vibrate) navigator.vibrate(HAPTIC_PATTERNS[kind]); }
    catch(e){ /* unsupported or blocked — visual press-state still applies */ }
  }

  // ABM-V9-83737001 : friendly "City (GMT±X)" display instead of raw IANA string (e.g. Asia/Manila -> Manila (GMT+8))
  function formatTimezone(tz){
    const city=(tz||'').split('/').pop().replace(/_/g,' ');
    const offsetMin=-new Date().getTimezoneOffset();
    const sign=offsetMin>=0?'+':'-';
    const abs=Math.abs(offsetMin);
    const hh=Math.floor(abs/60), mm=abs%60;
    const offsetStr=mm===0?`GMT${sign}${hh}`:`GMT${sign}${hh}:${String(mm).padStart(2,'0')}`;
    return `${city} (${offsetStr})`;
  }

  // ABM-V2-83736326 : cell generator (blanks for offset + real day numbers), Monday-first to match the week header
  function buildCalendarCells(year,month){
    const total=daysInMonth(year,month);
    const firstDow=(new Date(year,month,1).getDay()+6)%7;
    const cells=[];
    for(let i=0;i<firstDow;i++) cells.push(null);
    for(let d=1;d<=total;d++) cells.push(d);
    return cells;
  }

  // TODO(backend): replace with real call e.g. GET /api/availability?date=YYYY-MM-DD
  // ABM-V10-83737101 : delay removed — mock data resolves instantly, no loading flicker on date click
  function fetchAvailableTimes(year,month,day){
    const pool = ['9:00 AM','10:00 AM','11:00 AM','1:00 PM','2:00 PM','3:00 PM','4:00 PM'];
    s.availableTimes = pool;
    s.loadingTimes=false;
    render();
  }

  // ABM-V5-83736609 : TODO(backend) — swap for real Google/Outlook OAuth "add to calendar" instead of raw .ics download
  function downloadIcs(m){
    const ics=`BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:Artimeet — ${m.type}\nDESCRIPTION:Meeting ID ${m.meetingId}\nLOCATION:${m.location}\nEND:VEVENT\nEND:VCALENDAR`;
    const blob=new Blob([ics],{type:'text/calendar'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`${m.meetingId}.ics`;
    a.click();
  }

  function endTime(time,duration){
    let [hm,ap]=time.split(' ');
    let [h,m]=hm.split(':').map(Number);
    if(ap==='PM'&&h!==12)h+=12;
    if(ap==='AM'&&h===12)h=0;
    const d=new Date(2026,0,1,h,m+parseInt(duration));
    let hh=d.getHours(), aa=hh>=12?'PM':'AM';
    hh=hh%12||12;
   return `${hh}:${String(d.getMinutes()).padStart(2,'0')} ${aa}`;
  }

  // ABM-V10-83737104 : client-side persistence only — survives refresh in THIS browser, not cross-device.
  // TODO(backend): replace with real DB + auth (localStorage is not a substitute for a server-side data store).
  function saveSession(){
    try{
      localStorage.setItem('artimeet_session', JSON.stringify({account:s.account, meetings:s.meetings}));
    }catch(e){ /* storage unavailable — fail silently, app still works in-memory */ }
  }
  function loadSession(){
    // Local cache is used only for this browser's cached list of meetings while we
    // wait on the real Supabase session below (restoreSupabaseSession) to resolve.
    try{
      const raw=localStorage.getItem('artimeet_session');
      if(raw){
        const parsed=JSON.parse(raw);
        if(Array.isArray(parsed.meetings)) s.meetings=parsed.meetings;
      }
    }catch(e){ /* corrupted or unavailable — start clean */ }
  }

  // ABM-AUTH : source of truth for "am I signed in" — asks Supabase directly rather than
  // trusting the locally-cached account object, so a session that expired/was revoked
  // elsewhere doesn't leave the UI showing a stale signed-in state.
  async function restoreSupabaseSession(){
    const { data } = await sb.auth.getSession();
    const session = data && data.session;
    if(session && session.user){
      const profile = await fetchProfile(session.user.id);
      s.account = accountFromProfile(session.user, profile);
      s.view='home';
      await loadMyMeetings();
    } else {
      s.account=null;
    }
    render();
  }

  // Keeps s.account in sync if the token refreshes, the user signs in/out in another
  // tab, or the session expires while this tab is open.
  sb.auth.onAuthStateChange(async (event, session)=>{
    if(event==='SIGNED_OUT'){
      s.account=null; s.meetings=[]; saveSession();
      if(s.view!=='flow'){ s.view='flow'; s.step=0; render(); }
      return;
    }
    if((event==='SIGNED_IN'||event==='TOKEN_REFRESHED') && session && session.user){
      const profile = await fetchProfile(session.user.id);
      s.account=accountFromProfile(session.user, profile);
      saveSession();
    }
  });

  // ── AUTH + PROFILES DB (Supabase Email OTP → public.profiles table) ───
  // profiles.id is a foreign key to auth.users.id — see profiles.sql. A DB trigger
  // (handle_new_user) auto-creates the row the moment a new auth user is created, seeded
  // from raw_user_meta_data — which we set below via signInWithOtp's options.data.
  async function fetchProfile(userId){
    const { data, error } = await sb.from('profiles').select('*').eq('id', userId).single();
    if(error) return null; // e.g. trigger hasn't landed yet — verifyOtp() has a fallback upsert
    return data;
  }

  function accountFromProfile(user, profile){
    return {
      id: user ? user.id : null,
      name: (profile && profile.name) || '',
      email: user ? user.email : '',
      org: (profile && profile.organization) || '',
      phone: (profile && profile.phone) || '',
      timezone: (profile && profile.timezone) || s.timezone
    };
  }

  // Sends a one-time-passcode to the given email. shouldCreateUser controls whether a
  // brand-new auth user may be created (true for sign-up, false for sign-in-only).
  // signupData seeds raw_user_meta_data so the new-user DB trigger can populate profiles.
  async function sendOtp(email, shouldCreateUser, signupData){
    s.otpError='';
    s.authLoading=true;
    render();
    // ABM-V13 : wrapped in try/catch — previously an unexpected/network error here left
    // authLoading stuck true forever (button frozen on "Sending…", only Back usable).
    let error;
    try{
      ({ error } = await sb.auth.signInWithOtp({
        email,
        options:{ shouldCreateUser: !!shouldCreateUser, data: signupData || undefined }
      }));
    }catch(err){
      s.authLoading=false;
      s.otpError = (err && err.message) || 'Something went wrong sending the code. Check your connection and try again.';
      render();
      return false;
    }
    s.authLoading=false;
    if(error){
      s.otpError = error.message || 'Could not send the code. Please try again.';
      render();
      return false;
    }
    s.authEmail=email;
    s.otpDigits='';
    s.otpSentAt=Date.now();
    startResendCooldown();
    s.view='otp';
    render();
    return true;
  }

  // Verifies the 6-digit code the user typed against the email OTP that was sent.
  async function verifyOtp(code){
    s.otpError='';
    s.otpLoading=true;
    render();
    let data, error;
    try{
      ({ data, error } = await sb.auth.verifyOtp({
        email: s.authEmail,
        token: code,
        type:'email'
      }));
    }catch(err){
      s.otpLoading=false;
      s.otpError = (err && err.message) || 'Something went wrong verifying the code. Please try again.';
      render();
      return;
    }
    s.otpLoading=false;
    if(error){
      // ABM-AUTH : invalid or expired code — surface inline, keep the user on the OTP screen
      s.otpError = /expired/i.test(error.message) ? 'This code has expired. Request a new one.' : 'That code didn\'t match. Please check and try again.';
      render();
      return;
    }
    const user = data && data.user;
    let profile = user ? await fetchProfile(user.id) : null;
    if(s.otpMode==='signup' && user && !profile){
      // ABM-AUTH : fallback if the DB trigger hasn't landed the row yet — upsert directly
      const { data: upserted } = await sb.from('profiles').upsert({
        id:user.id, name:s.authNickname||'', email:user.email,
        organization:s.org||'', phone:s.phone||'', timezone:s.timezone
      }).select().single();
      profile = upserted;
    }
    s.account = accountFromProfile(user, profile);
    if(s.otpMode==='signup'){
      // ABM-V13 : if they already went through the guest booking flow (Type → Date/Time →
      // Details) before creating an account, that request was only sitting in local memory —
      // migrate it into the new, RLS-protected `meetings` row now instead of discarding it.
      if(user && s.meetingId && s.date && s.time){
        try{
          const { error: meetingError } = await sb.from('meetings').insert({
            user_id: user.id,
            meeting_ref: s.meetingId,
            type: s.type,
            meeting_date: s.date,
            meeting_time: s.time,
            duration: s.duration,
            location: s.location,
            notes: s.notes,
            status: s.requestStatus || 'Requested',
            calendar_status: s.calendarStatus || 'Not synced'
          });
          if(meetingError) console.error('Could not migrate guest meeting to account:', meetingError.message);
        }catch(e){ console.error('Could not migrate guest meeting to account:', e.message); }
      }
    }
    await loadMyMeetings(); // pulls this user's own meetings (RLS-scoped), migrated one included
    saveSession();
    s.otpDigits=''; s.otpError=''; s.authEmail=''; s.authNickname='';
    s.view='home';
    render();
  }

  function startResendCooldown(){
    s.resendCooldown=30;
    const tick=()=>{
      s.resendCooldown--;
      if(document.getElementById('resendOtp')||document.getElementById('resendCooldownLabel')) render();
      if(s.resendCooldown>0) setTimeout(tick,1000);
    };
    setTimeout(tick,1000);
  }

  async function resendOtp(){
    if(s.resendCooldown>0 || s.authLoading) return;
    await sendOtp(s.authEmail, s.otpMode==='signup');
  }

  // ABM-V13 : in-button loading→success sequence.
  // Previously this showed the "✓ Requested" success state on a fixed 150ms timer, BEFORE
  // the actual Supabase insert had even been attempted — so the UI could say "success" while
  // the write silently failed underneath it. Now it waits for doSave() to actually resolve:
  // success animation only plays once the row is confirmed saved; a failure reverts the
  // button and surfaces the real error instead of a false checkmark.
  function runRequestButtonSequence(btn,doSave){
    if(!btn){ doSave().then(finalizeMeetingRequestUI).catch(err=>alert('Could not save your meeting request: '+((err&&err.message)||'Please try again.'))); return; }
    btn.classList.add('is-loading');
    doSave().then(()=>{
      btn.classList.remove('is-loading');
      btn.classList.add('is-success');
      btn.textContent='✓ Requested';
      haptic('success');
      // ABM-V11-83737211 : brief beat between button success and confirmation card entering
      setTimeout(finalizeMeetingRequestUI,450);
    }).catch(err=>{
      btn.classList.remove('is-loading');
      alert('Could not save your meeting request: '+((err&&err.message)||'Please try again.'));
    });
  }

  // ── MEETINGS DB (Supabase, RLS-protected by user_id) ────────────────────
  // Loads the signed-in user's own meetings. RLS on public.meetings means this query can
  // only ever return rows where meetings.user_id = auth.uid() — even if the client code
  // were buggy or tampered with, the database itself won't hand back someone else's rows.
  async function loadMyMeetings(){
    if(!s.account || !s.account.id) return;
    const { data, error } = await sb.from('meetings')
      .select('*')
      .order('created_at', { ascending:false });
    if(error){ console.error('loadMyMeetings failed:', error.message); return; }
    s.meetings = (data||[]).map(row=>({
      meetingId: row.meeting_ref,
      date: row.meeting_date,
      time: row.meeting_time,
      type: row.type,
      location: row.location,
      requestStatus: row.status
    }));
  }

  // ABM-V13 : does the actual save and THROWS on failure — the caller (runRequestButtonSequence)
  // decides what the button/UI does with that; this function no longer touches s.step itself.
  async function saveMeetingRequest(name,org,email,phone,notes){
    s.name=name; s.org=org; s.email=email; s.phone=phone; s.notes=notes;
    s.meetingId='ABM-'+now.getFullYear()+'-'+Math.floor(1000+Math.random()*9000);
    if(s.account && s.account.id){
      // Signed-in guest becomes an owned, RLS-protected row — only this user's session can ever read it back.
      const { error } = await sb.from('meetings').insert({
        user_id: s.account.id,
        meeting_ref: s.meetingId,
        type: s.type,
        meeting_date: s.date,
        meeting_time: s.time,
        duration: s.duration,
        location: s.location,
        notes: notes,
        status: 'Requested',
        calendar_status: 'Not synced'
      });
      if(error) throw new Error(error.message);
      await loadMyMeetings();
    } else {
      // No account yet — nothing to attach a user_id to, so this stays local-only
      // (matches the existing "continue without an account" guest flow).
      s.meetings.push({
        meetingId:s.meetingId,
        date:s.date,
        time:s.time,
        type:s.type,
        location:s.location,
        requestStatus:'Requested'
      });
    }
    saveSession();
  }
