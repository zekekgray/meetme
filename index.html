<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArtiByte Meet</title>
<style>
:root{--gold:#c89f4a;--gold2:#e2c47d;--ink:#20201e;--muted:#77736b;--line:#e8e2d7;--cream:#faf8f3;--card:#fffdf9}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:980px;margin:auto;padding:24px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.brandmark{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#e4c878,#b88935);display:grid;place-items:center;color:white;font-weight:900;box-shadow:0 6px 16px #c8a85a33}
.brand small{display:block;color:var(--gold);font-size:12px;margin-top:-2px}
.menu{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:13px;font-size:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:25px;padding:30px;box-shadow:0 12px 38px #3025100b}
.hero{display:grid;grid-template-columns:1fr .72fr;gap:28px;align-items:center}
.eyebrow{color:var(--gold);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
h1{font-size:clamp(36px,5vw,56px);line-height:1;letter-spacing:-.045em;margin:9px 0 13px}
h2{font-size:28px;letter-spacing:-.03em;margin:5px 0 8px}
.sub,p{color:var(--muted);line-height:1.6}
.mascot{min-height:290px;border-radius:23px;background:linear-gradient(145deg,#fffdf7,#f5efe3);display:grid;place-items:center;overflow:hidden}
.bot{width:125px;height:125px;border-radius:43%;background:#f4efe3;border:7px solid #e8dfcd;position:relative;box-shadow:0 15px 35px #80662b18}
.bot:before,.bot:after{content:"";position:absolute;width:15px;height:15px;background:#333;border-radius:50%;top:43px}
.bot:before{left:31px}.bot:after{right:31px}
.smile{position:absolute;width:28px;height:14px;border-bottom:4px solid #333;border-radius:0 0 30px 30px;left:41px;top:63px}
.calendar-icon{position:absolute;right:-27px;bottom:-15px;background:var(--gold);color:#fff;border-radius:13px;padding:11px;font-size:23px;border:5px solid #fff}
.choices{display:grid;gap:9px;margin-top:19px}
.choice{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:left}
.choice.active{border-color:var(--gold);background:#fff9ea}
.dot{width:17px;height:17px;border:2px solid #cfc8ba;border-radius:50%;flex:none}
.choice.active .dot{border:5px solid var(--gold)}
.btn{border-radius:13px;padding:13px 18px;font-weight:750;font-size:14px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.primary{background:var(--gold);color:#fff;border-color:var(--gold);box-shadow:0 7px 16px #c29b4a33}
.full{width:100%;margin-top:18px}
.steps{display:flex;gap:7px;margin-bottom:20px}.stepdot{height:5px;flex:1;border-radius:5px;background:#eee9df}.stepdot.on{background:var(--gold)}
.calendar{border:1px solid var(--line);border-radius:17px;padding:17px;background:#fff}
.month{display:flex;justify-content:space-between;align-items:center;font-weight:750;margin-bottom:14px}
.month button{border:0;background:transparent;font-size:22px}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week span{font-size:11px;color:#999}
.day{padding:10px 2px;border:1px solid transparent;border-radius:10px;background:transparent}
.day.selected{background:var(--gold);color:#fff}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}
.time.active{background:var(--gold);color:#fff;border-color:var(--gold)}
.duration{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.duration .active{background:var(--gold);color:#fff;border-color:var(--gold)}
label{display:block;font-size:12px;font-weight:750;margin:14px 0 7px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff;outline:none}
input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #c89f4a18}
textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .primary{flex:1}
.confirm{text-align:center;max-width:620px;margin:auto}
.check{width:72px;height:72px;background:#d9f2d9;color:#438343;border-radius:50%;display:grid;place-items:center;font-size:40px;margin:0 auto 18px}
.summary{border:1px solid var(--line);border-radius:16px;padding:18px;text-align:left;background:#fff;margin:22px 0}
.row{display:flex;gap:12px;padding:9px 0}.row b{min-width:120px;font-size:13px}.row span{font-size:13px;color:var(--muted)}
.admin{display:none}.admin.show{display:block}
.req{border:1px solid var(--line);border-radius:16px;padding:15px;background:#fff;margin-top:10px}
.reqhead{display:flex;justify-content:space-between;gap:12px}.req small{display:block;color:var(--muted);margin-top:5px}
.pill{font-size:11px;padding:5px 9px;border-radius:999px;background:#fff1c9;color:#9a711e;font-weight:750;height:max-content}.pill.green{background:#e3f5e5;color:#43854b}
.reqactions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.reqactions .btn{padding:9px 12px;font-size:12px}
@media(max-width:720px){.app{padding:13px}.hero{grid-template-columns:1fr}.mascot{min-height:210px}.panel{padding:21px}.times{grid-template-columns:repeat(2,1fr)}.reqhead{flex-direction:column}.actions{flex-wrap:wrap}.actions .btn{flex:1}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="brandmark">A</div><div>ArtiByte<small>Meet</small></div></div>
    <button class="menu" id="menu" aria-label="Open internal meeting requests">☰</button>
  </header>

  <main id="public"></main>
  <section id="admin" class="admin"></section>
</div>

<script>
(() => {
  const publicView=document.getElementById('public');
  const adminView=document.getElementById('admin');

  let s={
    step:0,
    type:'Business / Partnership',
    day:'28',
    date:'August 28, 2026',
    time:'2:00 PM',
    duration:'30 min',
    name:'',org:'',email:'',phone:'',notes:''
  };

  const types=['Business / Partnership','Product Demo','Client Meeting','Technical Discussion','Career / Hiring','Other'];
  const days=['24','25','26','27','28','29','30'];

  function endTime(time,duration){
    let [hm,ap]=time.split(' ');
    let [h,m]=hm.split(':').map(Number);
    if(ap==='PM'&&h!==12)h+=12;
    if(ap==='AM'&&h===12)h=0;
    const d=new Date(2026,0,1,h,m+parseInt(duration));
    let hh=d.getHours(), aa=hh>=12?'PM':'AM';
    hh=hh%12||12;
    return `${hh}:${String(d.getMinutes()).padStart(2,'0')} ${aa}`;
  }

  function render(){
    if(s.step===0){
      publicView.innerHTML=`
      <div class="panel hero">
        <div>
          <div class="eyebrow">ArtiByte Meet</div>
          <h1>Let’s find a time.</h1>
          <p>Request a meeting with our team. Tell us what you’d like to discuss and we’ll take care of the rest.</p>
          <div class="choices">
            ${types.map(t=>`<button class="choice ${s.type===t?'active':''}" data-type="${t}"><span class="dot"></span><span>${t}</span></button>`).join('')}
          </div>
          <button class="btn primary full" id="next">Continue →</button>
        </div>
        <div class="mascot">
          <div class="bot"><div class="smile"></div><div class="calendar-icon">▦</div></div>
        </div>
      </div>`;
    }

    if(s.step===1){
      publicView.innerHTML=`
      <div class="panel">
        <div class="steps"><span class="stepdot on"></span><span class="stepdot on"></span><span class="stepdot"></span><span class="stepdot"></span></div>
        <h2>Choose a date</h2>
        <div class="sub">Pick a preferred time that works for you.</div>
        <div class="calendar">
          <div class="month"><button>‹</button><span>August 2026</span><button>›</button></div>
          <div class="week">${['M','T','W','T','F','S','S'].map(x=>`<span>${x}</span>`).join('')}</div>
          <div class="days">${days.map(d=>`<button class="day ${s.day===d?'selected':''}" data-day="${d}">${d}</button>`).join('')}</div>
        </div>
        <div style="margin-top:20px;font-weight:750">Available times</div>
        <div class="times">${['10:00 AM','11:00 AM','2:00 PM','3:00 PM'].map(t=>`<button class="btn time ${s.time===t?'active':''}" data-time="${t}">${t}</button>`).join('')}</div>
        <div style="margin-top:20px;font-weight:750">Duration</div>
        <div class="duration">${['30 min','45 min','60 min'].map(d=>`<button class="btn ${s.duration===d?'active':''}" data-duration="${d}">${d}</button>`).join('')}</div>
        <div class="actions"><button class="btn" id="back">← Back</button><button class="btn primary" id="next">Continue →</button></div>
      </div>`;
    }

    if(s.step===2){
      publicView.innerHTML=`
      <div class="panel">
        <div class="steps"><span class="stepdot on"></span><span class="stepdot on"></span><span class="stepdot on"></span><span class="stepdot"></span></div>
        <h2>Almost there. ✨</h2>
        <div class="sub">Just a few details so we can get back to you with a confirmation.</div>
        <form id="form">
          <label>Full name *</label><input id="name" required value="${s.name}" placeholder="Juan Dela Cruz">
          <label>Organization / company</label><input id="org" value="${s.org}" placeholder="ABC Company">
          <label>Email *</label><input id="email" type="email" required value="${s.email}" placeholder="juan@email.com">
          <label>Phone</label><input id="phone" value="${s.phone}" placeholder="+63 912 345 6789">
          <label>Notes (optional)</label><textarea id="notes" placeholder="Tell us anything we should know.">${s.notes}</textarea>
          <div class="actions"><button class="btn" id="back" type="button">← Back</button><button class="btn primary" type="submit">✈ Request Meeting</button></div>
        </form>
      </div>`;
    }

    if(s.step===3){
      publicView.innerHTML=`
      <div class="panel confirm">
        <div class="check">✓</div>
        <h2>Meeting requested!</h2>
        <p class="sub">Your request has been sent to the ArtiByte team.<br>We’ll email you once the meeting is confirmed.</p>
        <div class="summary">
          <div class="row"><b>📅 Date</b><span>${s.date}</span></div>
          <div class="row"><b>◷ Time</b><span>${s.time} – ${endTime(s.time,s.duration)}</span></div>
          <div class="row"><b>◇ Type</b><span>${s.type}</span></div>
          <div class="row"><b>👤 Guest</b><span>${s.name}${s.org?' · '+s.org:''}</span></div>
        </div>
        <button class="btn primary full" id="viewRequest">View Request</button>
        <button class="btn full" id="newRequest">Back to ArtiByte</button>
      </div>`;
    }
    bind();
  }

  function bind(){
    document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{s.type=b.dataset.type;render()});
    document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{s.day=b.dataset.day;s.date=`August ${s.day}, 2026`;render()});
    document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{s.time=b.dataset.time;render()});
    document.querySelectorAll('[data-duration]').forEach(b=>b.onclick=()=>{s.duration=b.dataset.duration;render()});

    const next=document.getElementById('next');
    if(next) next.onclick=()=>{s.step++;render()};

    const back=document.getElementById('back');
    if(back) back.onclick=()=>{s.step--;render()};

    const form=document.getElementById('form');
    if(form) form.onsubmit=e=>{
      e.preventDefault();
      s.name=document.getElementById('name').value.trim();
      s.org=document.getElementById('org').value.trim();
      s.email=document.getElementById('email').value.trim();
      s.phone=document.getElementById('phone').value.trim();
      s.notes=document.getElementById('notes').value.trim();
      s.step=3;
      render();
    };

    const vr=document.getElementById('viewRequest');
    if(vr) vr.onclick=showAdmin;

    const nr=document.getElementById('newRequest');
    if(nr) nr.onclick=()=>{s.step=0;render()};
  }

  function showAdmin(){
    publicView.style.display='none';
    adminView.classList.add('show');
    adminView.innerHTML=`
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
          <div><div class="eyebrow">Internal ArtiByte</div><h2>Meeting Requests</h2><div class="sub">Manage requests, confirmations and scheduling.</div></div>
          <button class="btn" id="publicBtn">← Public view</button>
        </div>
        <div class="req">
          <div class="reqhead">
            <div><b>${s.time} · ${s.name||'Juan Dela Cruz'}</b><small>${s.org||'ABC Company'} · ${s.type}</small></div>
            <span class="pill" id="status">Pending</span>
          </div>
          <div class="reqactions">
            <button class="btn primary" id="confirm">Confirm</button>
            <button class="btn" id="reschedule">Reschedule</button>
          </div>
        </div>
        <div class="req">
          <div class="reqhead"><div><b>4:00 PM · Maria Santos</b><small>XYZ Academy · Product Demo</small></div><span class="pill green">Confirmed</span></div>
          <div class="reqactions"><button class="btn">Open Meeting</button></div>
        </div>
      </div>`;

    document.getElementById('publicBtn').onclick=()=>{
      adminView.classList.remove('show');
      publicView.style.display='block';
      render();
    };

    document.getElementById('confirm').onclick=()=>{
      document.getElementById('status').textContent='Confirmed';
      document.getElementById('status').className='pill green';
      document.getElementById('confirm').disabled=true;
      document.getElementById('confirm').textContent='✓ Confirmed';
    };

    document.getElementById('reschedule').onclick=()=>{
      alert('Reschedule flow placeholder — connect this action to Google Calendar or Outlook in production.');
    };
  }

  document.getElementById('menu').onclick=showAdmin;
  render();
})();
</script>
</body>
</html>
